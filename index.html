<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員卡與載具 Canvas 管理器 (Supabase 雲端同步版)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Cropper.js (圖片裁切) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Barcode & QR Code 條碼生成庫 -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <!-- ZXing 條碼解碼庫 -->
  <script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: #f8fafc;
    }
    .card-canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1.586 / 1;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-canvas-container:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.15);
    }
    .card-canvas-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .modal-overlay { transition: opacity 0.25s ease, visibility 0.25s ease; }
    .hidden-modal { opacity: 0; pointer-events: none; visibility: hidden; }
    .active-modal { opacity: 1; pointer-events: auto; visibility: visible; }

    .cropper-view-box { outline: 2px solid #2563eb !important; outline-color: rgba(37, 99, 235, 0.85) !important; }
    .cropper-line { background-color: #2563eb !important; }
    .cropper-point {
      background-color: #2563eb !important;
      width: 12px !important; height: 12px !important;
      opacity: 0.95 !important; border-radius: 50% !important;
      border: 2px solid #ffffff !important; box-shadow: 0 2px 5px rgba(0,0,0,0.3) !important;
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-12">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
          <i class="fa-solid fa-paintbrush"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">Canvas 智慧會員卡包</h1>
          <p class="text-xs text-slate-500">Supabase 雲端即時同步版</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openSyncSettingsModal()" id="cloudStatusBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200 transition">
          <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="cloudStatusText">連線中...</span>
        </button>
        <button onclick="openSyncSettingsModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-cloud-arrow-up text-blue-600"></i>
          <span class="hidden sm:inline">同步設定</span>
        </button>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span class="hidden sm:inline">新增卡片</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-5">
    <!-- 標籤切換 -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1">
      <button id="tabAll" onclick="switchMainTab('all')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap bg-blue-600 text-white shadow-sm">
        全部 <span id="countAll" class="px-1.5 py-0.5 rounded-full text-[10px] bg-white/20 text-white">0</span>
      </button>
      <button id="tabExpiring" onclick="switchMainTab('expiring')" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-2 whitespace-nowrap bg-white border border-slate-200">
        即將過期 <span id="countExpiring" class="px-1.5 py-0.5 rounded-full text-[10px] bg-amber-100 text-amber-800 font-bold">0</span>
      </button>
      <button id="tabValid" onclick="switchMainTab('valid')" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-2 whitespace-nowrap bg-white border border-slate-200">
        有效卡片 <span id="countValid" class="px-1.5 py-0.5 rounded-full text-[10px] bg-slate-100 text-slate-600">0</span>
      </button>
    </div>

    <!-- 搜尋與過濾 -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="搜尋名稱、號碼..." class="w-full pl-9 pr-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="grid grid-cols-3 gap-2 md:w-auto">
        <select id="ownerFilter" class="px-2.5 py-2 text-xs border border-slate-200 rounded-xl outline-none bg-white"><option value="">所有持有人</option></select>
        <select id="categoryFilter" class="px-2.5 py-2 text-xs border border-slate-200 rounded-xl outline-none bg-white"><option value="">所有分類</option></select>
        <select id="expiryFilter" class="px-2.5 py-2 text-xs border border-slate-200 rounded-xl outline-none bg-white">
          <option value="">所有效期</option>
          <option value="valid">有效</option>
          <option value="warning">即將到期</option>
          <option value="expired">已過期</option>
        </select>
      </div>
    </div>

    <!-- 卡片列表 -->
    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- Modals (新增/編輯, 放大, 裁切, 刪除, 同步) -->
  <!-- [保留你原始 HTML 中所有的 Modal 結構，這裡為了篇幅精簡省略重複標籤，請確保檔案中包含這些 ID] -->
  <!-- 包括: addModal, scanModal, cropModal, deleteModal, syncSettingsModal -->
  
  <!-- 新增/編輯 Modal -->
  <div id="addModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b pb-3 sticky top-0 bg-white z-10">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新增卡片 / 載具</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="cardForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">名稱 *</label>
          <input type="text" id="title" list="titleList" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
          <datalist id="titleList"></datalist>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="text" id="code1D" placeholder="一維條碼" class="w-full px-3 py-2 border rounded-lg text-sm font-mono">
          <input type="text" id="code2D" placeholder="二維碼 (QR)" class="w-full px-3 py-2 border rounded-lg text-sm font-mono">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="owner" list="ownerList" placeholder="持有人" required class="w-full px-3 py-2 border rounded-lg text-sm">
          <datalist id="ownerList"></datalist>
          <input type="text" id="category" list="categoryList" placeholder="分類" required class="w-full px-3 py-2 border rounded-lg text-sm">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <input type="date" id="expiryDate" class="w-full px-3 py-2 border rounded-lg text-sm">
          <select id="canvasStyle" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
            <option value="gradient">經典漸層</option>
            <option value="chip">黑金晶片卡</option>
            <option value="pattern">幾何網格</option>
            <option value="wave">水波流線</option>
          </select>
        </div>
        <input type="color" id="cardColor" value="#2563eb" class="h-9 w-full rounded cursor-pointer border p-0.5">

        <div class="grid grid-cols-2 gap-3">
          <div class="border p-2 rounded-xl text-center bg-slate-50 cursor-pointer" onclick="document.getElementById('imageInput1D').click()">
            <span class="text-[10px] block">一維圖片</span>
            <input type="file" id="imageInput1D" accept="image/*" class="hidden">
            <div id="imagePreviewContainer1D" class="hidden h-16 mt-1 bg-white border rounded overflow-hidden"><img id="imagePreview1D" class="h-full w-full object-contain"></div>
          </div>
          <div class="border p-2 rounded-xl text-center bg-slate-50 cursor-pointer" onclick="document.getElementById('imageInput2D').click()">
            <span class="text-[10px] block">二維圖片</span>
            <input type="file" id="imageInput2D" accept="image/*" class="hidden">
            <div id="imagePreviewContainer2D" class="hidden h-16 mt-1 bg-white border rounded overflow-hidden"><img id="imagePreview2D" class="h-full w-full object-contain"></div>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl shadow">儲存並同步</button>
      </form>
    </div>
  </div>

  <!-- 放大掃描 Modal -->
  <div id="scanModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl text-center relative">
      <button onclick="closeScanModal()" class="absolute right-4 top-4 text-slate-400 text-2xl"><i class="fa-solid fa-circle-xmark"></i></button>
      <h3 id="scanTitle" class="text-2xl font-bold mb-1"></h3>
      <p id="scanMeta" class="text-xs text-slate-500 mb-3"></p>
      <div class="flex justify-center gap-2 mb-4 bg-slate-100 p-1 rounded-xl w-fit mx-auto">
        <button id="scanBtn1D" onclick="switchScanBarcodeType('CODE128')" class="px-4 py-1.5 rounded-lg text-xs font-bold">條碼</button>
        <button id="scanBtnQR" onclick="switchScanBarcodeType('QR')" class="px-4 py-1.5 rounded-lg text-xs font-bold">QR</button>
      </div>
      <canvas id="scanCanvas" class="w-full h-auto rounded-xl border shadow-inner mb-4"></canvas>
      <button onclick="downloadCanvasPNG()" class="text-xs font-bold text-slate-600 bg-slate-100 px-4 py-2 rounded-xl">下載圖片</button>
    </div>
  </div>

  <!-- 裁切 Modal -->
  <div id="cropModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[60] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl flex flex-col gap-4">
      <div class="flex justify-between border-b pb-2">
        <h3 class="font-bold">裁切圖片</h3>
        <button onclick="closeCropModal(false)"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="relative bg-slate-900 h-[300px] flex items-center justify-center">
        <img id="cropTargetImage" class="max-h-full">
      </div>
      <div class="flex justify-between">
        <button onclick="rotateCropImage(-90)" class="bg-slate-100 px-3 py-1 rounded">左轉</button>
        <button onclick="confirmCrop()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">確認</button>
        <button onclick="rotateCropImage(90)" class="bg-slate-100 px-3 py-1 rounded">右轉</button>
      </div>
    </div>
  </div>

  <!-- 刪除確認 Modal -->
  <div id="deleteModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl text-center space-y-4 max-w-xs w-full shadow-2xl">
      <h4 class="font-bold">確定刪除？</h4>
      <div class="flex gap-2">
        <button onclick="closeDeleteModal()" class="flex-1 bg-slate-100 py-2 rounded-xl">取消</button>
        <button onclick="confirmDeleteCard()" class="flex-1 bg-rose-600 text-white py-2 rounded-xl font-bold">刪除</button>
      </div>
    </div>
  </div>

  <!-- 同步設定 Modal -->
  <div id="syncSettingsModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between border-b pb-3">
        <h3 class="font-bold">雲端同步設定</h3>
        <button onclick="closeSyncSettingsModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="bg-slate-50 p-4 rounded-xl border space-y-3">
        <label class="text-xs font-bold block">專屬同步暗號 (Sync Key)</label>
        <div class="flex gap-2">
          <input type="text" id="syncKeyInput" class="flex-1 px-3 py-2 text-xs border rounded-xl font-mono outline-none">
          <button onclick="applyCustomSyncKey()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">儲存配對</button>
        </div>
        <p class="text-[10px] text-slate-500">在其他裝置輸入相同暗號即可同步資料。</p>
      </div>
      <button onclick="pushLocalCardsToCloud()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold">上傳本機卡片至雲端</button>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportCardsJSON()" class="bg-slate-100 py-2 rounded-xl text-xs font-bold">匯出備份</button>
        <button onclick="document.getElementById('importJsonFileInput').click()" class="bg-slate-100 py-2 rounded-xl text-xs font-bold">匯入備份</button>
        <input type="file" id="importJsonFileInput" accept=".json" class="hidden" onchange="importCardsJSON(event)">
      </div>
    </div>
  </div>

  <!-- JavaScript 邏輯 (Supabase) -->
  <script>
    // --- 1. Supabase 初始化配置 ---
    const SUPABASE_URL = 'https://你的專案代碼.supabase.co'; // <--- 請修改這裡
    const SUPABASE_KEY = '你的anon_public_key';          // <--- 請修改這裡
    const _db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- 2. 全域變數 ---
    window.cards = [];
    let currentMainTab = 'all';
    let editingCardId = null;
    let pendingDeleteId = null;
    let currentScanCardId = null;
    let cropperInstance = null;
    let onCropSuccessCallback = null;

    let currentUploadedImageData1D = '';
    let currentUploadedImageData2D = '';
    let currentRawImageData1D = '';
    let currentRawImageData2D = '';

    // --- 3. 同步暗號管理 ---
    function getStoredSyncKey() {
      let key = localStorage.getItem('canvas_cards_sync_key');
      if (!key) {
        key = 'common-wallet-room';
        localStorage.setItem('canvas_cards_sync_key', key);
      }
      return key;
    }
    window.currentSyncKey = getStoredSyncKey();

    // --- 4. 核心同步功能 ---
    async function initCloudSync() {
      updateCloudStatusUI(false, '連線中...');
      
      // 首次加載
      await fetchCardsFromCloud();

      // 監聽即時更新 (Realtime)
      _db.channel('cards_realtime')
        .on('postgres_changes', { 
          event: '*', 
          schema: 'public', 
          table: 'cards',
          filter: `sync_key=eq.${window.currentSyncKey}`
        }, (payload) => {
          console.log('雲端偵測到更新');
          fetchCardsFromCloud(); 
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') updateCloudStatusUI(true, `雲端同步中 (${window.currentSyncKey})`);
        });
    }

    async function fetchCardsFromCloud() {
      const { data, error } = await _db
        .from('cards')
        .select('*')
        .eq('sync_key', window.currentSyncKey)
        .order('id', { ascending: false });

      if (error) {
        console.error('抓取失敗:', error);
        return;
      }

      if (data) {
        window.cards = data.map(dbRow => ({
          id: parseInt(dbRow.id),
          title: dbRow.title,
          owner: dbRow.owner,
          category: dbRow.category,
          code1D: dbRow.code1d || '',
          code2D: dbRow.code2d || '',
          activeBarcodeType: dbRow.active_barcode_type || 'CODE128',
          expiryDate: dbRow.expiry_date || '',
          cardColor: dbRow.card_color || '#2563eb',
          canvasStyle: dbRow.canvas_style || 'gradient',
          bgImage1D: dbRow.bg_image1d || '',
          bgImage2D: dbRow.bg_image2d || '',
          rawImage1D: dbRow.raw_image1d || '',
          rawImage2D: dbRow.raw_image2d || '',
          syncKey: dbRow.sync_key
        }));
        
        localStorage.setItem('canvas_cards_v3', JSON.stringify(window.cards));
        updateDropdowns();
        renderAllCards();
      }
    }

    window.saveCardToCloud = async function(card) {
      const row = {
        id: card.id,
        sync_key: window.currentSyncKey,
        title: card.title,
        owner: card.owner,
        category: card.category,
        code1d: card.code1D,
        code2d: card.code2D,
        active_barcode_type: card.activeBarcodeType,
        expiry_date: card.expiryDate,
        card_color: card.cardColor,
        canvas_style: card.canvasStyle,
        bg_image1d: card.bgImage1D,
        bg_image2d: card.bgImage2D,
        raw_image1d: card.rawImage1D,
        raw_image2d: card.rawImage2D,
        updated_at: new Date()
      };

      const { error } = await _db.from('cards').upsert(row);
      if (error) {
        console.error('儲存失敗:', error);
        showToast('⚠️ 同步失敗 (圖片可能過大)');
      } else {
        showToast('☁️ 已即時同步至雲端');
      }
    };

    window.deleteCardFromCloud = async function(cardId) {
      const { error } = await _db.from('cards').delete().eq('id', cardId);
      if (error) {
        console.error('刪除失敗:', error);
      } else {
        showToast('☁️ 雲端已同步刪除');
        window.cards = window.cards.filter(c => c.id !== cardId);
        saveAndRefreshLocal();
      }
    };

    window.pushLocalCardsToCloud = async function() {
      if (!window.cards || window.cards.length === 0) return;
      showToast('⚡ 正在同步所有卡片...');
      for (const card of window.cards) {
        await window.saveCardToCloud(card);
      }
      showToast('✅ 全數上傳完成！');
    };

    function applyCustomSyncKey() {
      const val = document.getElementById('syncKeyInput').value.trim();
      if (!val) return;
      window.currentSyncKey = val;
      localStorage.setItem('canvas_cards_sync_key', val);
      initCloudSync();
      showToast(`已切換暗號：${val}`);
      closeSyncSettingsModal();
    }

    // --- 5. UI 與 繪圖邏輯 (保留你原本所有的 Canvas 函數) ---
    function updateCloudStatusUI(isOnline, text) {
      const dot = document.getElementById('cloudStatusDot');
      const txt = document.getElementById('cloudStatusText');
      if (txt) txt.innerText = text;
      if (dot) dot.className = isOnline ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
    }

    function saveAndRefreshLocal() {
      localStorage.setItem('canvas_cards_v3', JSON.stringify(window.cards));
      updateDropdowns();
      renderAllCards();
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-lg text-xs z-[100] flex items-center gap-2';
      toast.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> ${msg}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // [此處之後的所有 renderAllCards, drawCardCanvas, handleCardFormSubmit 等函數，皆與你原檔相同，僅需確保呼叫 saveCardToCloud]
    
    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('cardForm').addEventListener('submit', handleCardFormSubmit);
      document.getElementById('searchInput').addEventListener('input', renderAllCards);
      document.getElementById('syncKeyInput').value = window.currentSyncKey;
      
      setupImageUploadHandlers();
      initCloudSync();
    });

    // --- 以下為你原有的 Canvas 與 互動邏輯的複製 (簡化展示核心修改點) ---

    function handleCardFormSubmit(e) {
      e.preventDefault();
      const newId = editingCardId || Date.now();
      const card = {
        id: newId,
        title: document.getElementById('title').value,
        code1D: document.getElementById('code1D').value,
        code2D: document.getElementById('code2D').value,
        owner: document.getElementById('owner').value,
        category: document.getElementById('category').value,
        expiryDate: document.getElementById('expiryDate').value,
        cardColor: document.getElementById('cardColor').value,
        canvasStyle: document.getElementById('canvasStyle').value,
        bgImage1D: currentUploadedImageData1D,
        bgImage2D: currentUploadedImageData2D,
        rawImage1D: currentRawImageData1D,
        rawImage2D: currentRawImageData2D,
        activeBarcodeType: (document.getElementById('code1D').value || currentUploadedImageData1D) ? 'CODE128' : 'QR'
      };
      
      window.saveCardToCloud(card);
      closeAddModal();
    }

    // [這裡請手動將你原檔中，從 'function getExpiryStatus(dateStr)' 到結尾的所有 Script 邏輯貼回此處]
    // 唯一要修改的是：
    // 1. 把所有呼叫 'window.saveCardToCloud' 的地方保留。
    // 2. 移除任何對 'Firebase' 的參照。
    
    // --- 圖片處理與裁切 (與原檔一致) ---
    async function triggerCropFlow(file, targetType, flowType) {
      const reader = new FileReader();
      reader.onload = (e) => {
        openCropModal(e.target.result, (croppedData) => {
          if (targetType === 'QR') {
            currentUploadedImageData2D = croppedData;
            document.getElementById('imagePreview2D').src = croppedData;
            document.getElementById('imagePreviewContainer2D').classList.remove('hidden');
          } else {
            currentUploadedImageData1D = croppedData;
            document.getElementById('imagePreview1D').src = croppedData;
            document.getElementById('imagePreviewContainer1D').classList.remove('hidden');
          }
        });
      };
      reader.readAsDataURL(file);
    }

    function openCropModal(url, cb) {
      onCropSuccessCallback = cb;
      document.getElementById('cropTargetImage').src = url;
      document.getElementById('cropModal').classList.add('active-modal');
      setTimeout(() => {
        if(cropperInstance) cropperInstance.destroy();
        cropperInstance = new Cropper(document.getElementById('cropTargetImage'), { aspectRatio: 400/252, viewMode: 1 });
      }, 100);
    }
    
    function confirmCrop() {
      const cropped = cropperInstance.getCroppedCanvas({ width: 500 }).toDataURL('image/jpeg', 0.6);
      onCropSuccessCallback(cropped);
      closeCropModal();
    }

    // 由於篇幅限制，以下為輔助函數與原邏輯的存根
    // 請將原檔 script 剩下的部分填補於此...
    function switchMainTab(t){ currentMainTab=t; renderAllCards(); }
    function openAddModal(){ editingCardId=null; document.getElementById('cardForm').reset(); document.getElementById('addModal').classList.add('active-modal'); }
    function closeAddModal(){ document.getElementById('addModal').classList.remove('active-modal'); }
    function openScanModal(id){ currentScanCardId=id; renderScan(); document.getElementById('scanModal').classList.add('active-modal'); }
    function closeScanModal(){ document.getElementById('scanModal').classList.remove('active-modal'); }
    function openSyncSettingsModal(){ document.getElementById('syncSettingsModal').classList.add('active-modal'); }
    function closeSyncSettingsModal(){ document.getElementById('syncSettingsModal').classList.remove('active-modal'); }

    // 原有的畫圖與渲染邏輯（請直接沿用原檔代碼）
    async function drawCardCanvas(canvas, card, isScan=false) {
       // ... 複製你原檔中的 drawCardCanvas 邏輯 ...
       const ctx = canvas.getContext('2d');
       ctx.fillStyle = card.cardColor;
       ctx.fillRect(0,0, canvas.width, canvas.height);
       // ... 略 ...
    }

    function renderAllCards() {
       // ... 複製你原檔中的 renderAllCards 邏輯 ...
       const container = document.getElementById('cardGrid');
       container.innerHTML = window.cards.map(c => `<div onclick="openScanModal(${c.id})">${c.title}</div>`).join('');
    }

    // 綁定全域視窗函數以便 HTML 呼叫
    window.switchMainTab = switchMainTab;
    window.openAddModal = openAddModal;
    window.closeAddModal = closeAddModal;
    window.openScanModal = openScanModal;
    window.closeScanModal = closeScanModal;
    window.openSyncSettingsModal = openSyncSettingsModal;
    window.closeSyncSettingsModal = closeSyncSettingsModal;
    window.applyCustomSyncKey = applyCustomSyncKey;
    window.confirmCrop = confirmCrop;
    window.closeCropModal = () => document.getElementById('cropModal').classList.remove('active-modal');
    window.rotateCropImage = (d) => cropperInstance.rotate(d);
  </script>
</body>
</html>
