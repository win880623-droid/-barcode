<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 智慧卡包 (穩定修復版)</title>

  <!-- 1. 先載入必要的函式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  
  <!-- Supabase SDK 必須在自定義腳本前載入 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; }
    .card-canvas-container {
      position: relative; width: 100%; aspect-ratio: 1.586 / 1;
      border-radius: 1rem; overflow: hidden;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease; cursor: pointer;
    }
    .card-canvas-container canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    .modal-overlay { transition: opacity 0.25s ease, visibility 0.25s ease; z-index: 50; }
    .hidden-modal { opacity: 0; pointer-events: none; visibility: hidden; }
    .active-modal { opacity: 1; pointer-events: auto; visibility: visible; }
    .preview-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; }
    .btn-mini { background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 6px; font-size: 10px; }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-12">

  <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-md"><i class="fa-solid fa-paintbrush"></i></div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">Canvas 智慧卡包</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <!-- 修正：確保這個按鈕永遠可以點擊 -->
        <button onclick="openSyncSettingsModal()" id="cloudStatusBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-white border shadow-sm transition flex items-center gap-1.5 cursor-pointer">
          <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="cloudStatusText">設定連線</span>
        </button>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i><span>新增</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-5">
    <!-- 切換標籤 -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1">
      <button id="tabAll" onclick="switchMainTab('all')" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white">全部 <span id="countAll">0</span></button>
      <button id="tabExpiring" onclick="switchMainTab('expiring')" class="px-4 py-2 rounded-xl text-xs font-medium bg-white border">即將過期 <span id="countExpiring">0</span></button>
      <button id="tabValid" onclick="switchMainTab('valid')" class="px-4 py-2 rounded-xl text-xs font-medium bg-white border">有效 <span id="countValid">0</span></button>
    </div>

    <!-- 搜尋區 -->
    <div class="bg-white p-4 rounded-2xl border shadow-sm flex flex-col md:flex-row gap-3">
      <input type="text" id="searchInput" placeholder="搜尋名稱、持有者..." class="flex-1 px-4 py-2 text-xs border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
      <div class="grid grid-cols-2 gap-2">
        <select id="ownerFilter" class="px-2 py-2 text-xs border rounded-xl bg-white"><option value="">持有人</option></select>
        <select id="categoryFilter" class="px-2 py-2 text-xs border rounded-xl bg-white"><option value="">分類</option></select>
      </div>
    </div>

    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- 同步設定 Modal (修正：確保 ID 正確且無遮擋) -->
  <div id="syncSettingsModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-lg">雲端同步設定</h3>
        <button onclick="closeSyncSettingsModal()" class="text-slate-400 text-2xl">×</button>
      </div>
      <div class="bg-blue-50 p-4 rounded-xl space-y-2">
        <label class="text-xs font-bold block text-blue-800">同步暗號 (房號)</label>
        <div class="flex gap-2">
          <input type="text" id="syncKeyInput" placeholder="例如：my-family-room" class="flex-1 px-3 py-2 text-sm border rounded-xl outline-none">
          <button onclick="applyCustomSyncKey()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">儲存並配對</button>
        </div>
      </div>
      <button onclick="pushLocalCardsToCloud()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold">上傳本機卡片至雲端</button>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportCardsJSON()" class="bg-slate-100 py-2 rounded-xl text-xs font-bold">匯出備份</button>
        <button onclick="document.getElementById('importJsonFileInput').click()" class="bg-slate-100 py-2 rounded-xl text-xs font-bold">匯入備份</button>
      </div>
      <input type="file" id="importJsonFileInput" accept=".json" class="hidden" onchange="importCardsJSON(event)">
    </div>
  </div>

  <!-- 新增/編輯 Modal -->
  <div id="addModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 id="modalTitle" class="font-bold">卡片編輯</h3>
        <button onclick="closeAddModal()" class="text-slate-400 text-2xl">×</button>
      </div>
      <form id="cardForm" class="space-y-4">
        <input type="text" id="title" placeholder="卡片名稱" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="code1D" placeholder="條碼號碼" class="px-3 py-2 border rounded-lg text-sm font-mono">
          <input type="text" id="code2D" placeholder="QR 號碼" class="px-3 py-2 border rounded-lg text-sm font-mono">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="owner" placeholder="持有人" required class="px-3 py-2 border rounded-lg text-sm">
          <input type="text" id="category" placeholder="分類" required class="px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <input type="date" id="expiryDate" class="px-3 py-2 border rounded-lg text-sm">
          <select id="canvasStyle" class="px-3 py-2 border rounded-lg text-sm bg-white">
            <option value="gradient">經典漸層</option>
            <option value="chip">黑金晶片</option>
          </select>
        </div>
        <input type="color" id="cardColor" value="#2563eb" class="h-9 w-full rounded border p-0.5">
        
        <div class="grid grid-cols-2 gap-3">
          <div class="relative border-2 border-dashed p-3 rounded-xl text-center bg-slate-50 cursor-pointer" onclick="document.getElementById('imageInput1D').click()">
            <span class="text-[10px] font-bold block">上傳條碼照片</span>
            <input type="file" id="imageInput1D" accept="image/*" class="hidden">
            <div id="imagePreviewContainer1D" class="hidden h-20 mt-1 bg-white border rounded relative">
              <img id="imagePreview1D" class="h-full w-full object-contain">
              <div class="preview-actions">
                <button type="button" onclick="event.stopPropagation(); reCropExistingImage('1D')" class="btn-mini">裁切</button>
              </div>
            </div>
          </div>
          <div class="relative border-2 border-dashed p-3 rounded-xl text-center bg-slate-50 cursor-pointer" onclick="document.getElementById('imageInput2D').click()">
            <span class="text-[10px] font-bold block">上傳 QR 照片</span>
            <input type="file" id="imageInput2D" accept="image/*" class="hidden">
            <div id="imagePreviewContainer2D" class="hidden h-20 mt-1 bg-white border rounded relative">
              <img id="imagePreview2D" class="h-full w-full object-contain">
              <div class="preview-actions">
                <button type="button" onclick="event.stopPropagation(); reCropExistingImage('2D')" class="btn-mini">裁切</button>
              </div>
            </div>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl shadow">儲存同步</button>
      </form>
    </div>
  </div>

  <!-- 放大掃描 Modal -->
  <div id="scanModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/90 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl text-center relative">
      <button onclick="closeScanModal()" class="absolute right-4 top-4 text-slate-400 text-2xl">×</button>
      <h3 id="scanTitle" class="text-2xl font-bold mb-4"></h3>
      <div class="flex justify-center gap-2 mb-4">
        <button id="scanBtn1D" onclick="switchScanBarcodeType('CODE128')" class="px-6 py-2 rounded-lg text-xs font-bold">條碼</button>
        <button id="scanBtnQR" onclick="switchScanBarcodeType('QR')" class="px-6 py-2 rounded-lg text-xs font-bold">QR</button>
      </div>
      <canvas id="scanCanvas" class="w-full h-auto rounded-xl border shadow-inner mb-4"></canvas>
      <button onclick="downloadCanvasPNG()" class="text-xs font-bold text-blue-600">下載圖片</button>
    </div>
  </div>

  <!-- 裁切 Modal -->
  <div id="cropModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/90 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl flex flex-col gap-4">
      <h3 class="font-bold border-b pb-2">裁切條碼</h3>
      <div class="relative bg-slate-900 h-[300px] flex items-center justify-center rounded-lg">
        <img id="cropTargetImage" class="max-h-full">
      </div>
      <div class="flex justify-between">
        <button onclick="rotateCropImage(-90)" class="bg-slate-100 p-2 rounded">左轉</button>
        <button onclick="confirmCrop()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold">確認</button>
        <button onclick="rotateCropImage(90)" class="bg-slate-100 p-2 rounded">右轉</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. 初始化與配置 ---
    const SUPABASE_URL = 'https://msuwmgyvlcaodgpttfcr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_h89jxsCmM3bcTKdHqr5WhA_vGvb-EhS';
    let _db = null;

    window.cards = [];
    let currentMainTab = 'all';
    let editingCardId = null;
    let currentScanCardId = null;
    let cropperInstance = null;
    let onCropSuccessCallback = null;

    let currentUploadedImageData1D = '', currentUploadedImageData2D = '';
    let currentRawImageData1D = '', currentRawImageData2D = '';

    // --- 2. 核心啟動邏輯 (防卡死設計) ---
    window.onload = function() {
      // 確保即使 SDK 出錯，介面按鈕也要能用
      window.currentSyncKey = localStorage.getItem('canvas_cards_sync_key') || 'common-wallet-room';
      document.getElementById('syncKeyInput').value = window.currentSyncKey;

      try {
        _db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        initCloudSync();
      } catch (err) {
        console.error("Supabase 初始化失敗:", err);
        updateCloudStatusUI(false, "離線模式");
      }

      // 綁定過濾器事件
      ['searchInput', 'ownerFilter', 'categoryFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', renderAllCards);
        document.getElementById(id).addEventListener('change', renderAllCards);
      });
      
      setupImageUploadHandlers();
      renderAllCards(); // 先渲染一次本機資料
    };

    async function initCloudSync() {
      if (!_db) return;
      updateCloudStatusUI(false, "連線中...");
      
      try {
        await fetchCardsFromCloud();
        _db.channel('cards_room')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'cards', filter: `sync_key=eq.${window.currentSyncKey}` }, () => {
            fetchCardsFromCloud();
          })
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') updateCloudStatusUI(true, `房號：${window.currentSyncKey}`);
          });
      } catch (e) {
        updateCloudStatusUI(false, "連線失敗");
      }
    }

    async function fetchCardsFromCloud() {
      if (!_db) return;
      const { data, error } = await _db.from('cards').select('*').eq('sync_key', window.currentSyncKey);
      if (data) {
        window.cards = data.map(dbRow => ({
          id: parseInt(dbRow.id), title: dbRow.title, owner: dbRow.owner, category: dbRow.category,
          code1D: dbRow.code1d||'', code2D: dbRow.code2d||'', activeBarcodeType: dbRow.active_barcode_type||'CODE128',
          expiryDate: dbRow.expiry_date||'', cardColor: dbRow.card_color||'#2563eb', canvasStyle: dbRow.canvas_style||'gradient',
          bgImage1D: dbRow.bg_image1d||'', bgImage2D: dbRow.bg_image2d||'', rawImage1D: dbRow.raw_image1d||'', rawImage2D: dbRow.raw_image2d||''
        }));
        updateDropdowns();
        renderAllCards();
      }
    }

    // --- 3. 繪圖核心 (防止變形) ---
    async function drawCardCanvas(canvas, card, isScan = false) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = isScan ? '#ffffff' : card.cardColor;
      ctx.fillRect(0, 0, w, h);

      if (!isScan) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(card.title || '未命名', 20, 45);
      }

      const activeType = card.activeBarcodeType || 'CODE128';
      const code = (activeType === 'QR' ? card.code2D : card.code1D) || '';
      const bgImgSrc = (activeType === 'QR' ? card.bgImage2D : card.bgImage1D);

      const margin = 15;
      const boxH = isScan ? h - 40 : h * 0.65, boxW = w - margin * 2;
      const boxY = h - boxH - margin;
      
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(margin, boxY, boxW, boxH);

      if (bgImgSrc) {
        const img = new Image();
        img.src = bgImgSrc;
        await new Promise(r => img.onload = r);
        const pad = 10, maxW = boxW - pad*2, maxH = boxH - pad*2;
        const ratio = Math.min(maxW / img.width, maxH / img.height);
        const dW = img.width * ratio, dH = img.height * ratio;
        ctx.drawImage(img, margin + (boxW-dW)/2, boxY + (boxH-dH)/2, dW, dH);
      } else if (code) {
        const bcImg = await generateBarcodeImage(code, activeType);
        if (bcImg) {
          const dH = activeType==='QR' ? boxH*0.8 : boxH*0.6, dW = activeType==='QR' ? dH : boxW*0.9;
          ctx.drawImage(bcImg, (w-dW)/2, boxY + (boxH-dH)/2, dW, dH);
        }
      }
    }

    // --- 4. 功能 UI 控制 ---
    function renderAllCards() {
      const container = document.getElementById('cardGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const ownerF = document.getElementById('ownerFilter').value;
      const catF = document.getElementById('categoryFilter').value;

      const filtered = window.cards.filter(c => {
        const status = getExpiryStatus(c.expiryDate).status;
        if (currentMainTab === 'expiring' && status === 'valid') return false;
        if (currentMainTab === 'valid' && status !== 'valid') return false;
        
        const matchesSearch = c.title.toLowerCase().includes(search) || c.owner.toLowerCase().includes(search);
        const matchesOwner = ownerF === "" || c.owner === ownerF;
        const matchesCat = catF === "" || c.category === catF;

        return matchesSearch && matchesOwner && matchesCat;
      });

      document.getElementById('countAll').innerText = window.cards.length;
      document.getElementById('countExpiring').innerText = window.cards.filter(c => getExpiryStatus(c.expiryDate).status !== 'valid').length;
      document.getElementById('countValid').innerText = window.cards.filter(c => getExpiryStatus(c.expiryDate).status === 'valid').length;

      container.innerHTML = filtered.map(c => `
        <div class="bg-white rounded-2xl border shadow-sm overflow-hidden flex flex-col">
          <div class="p-3 flex justify-between border-b items-center">
            <span class="font-bold text-sm truncate">${c.title}</span>
            <div class="flex gap-1">
              <button onclick="openEditModal(event, ${c.id})" class="text-slate-400 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deleteCard(event, ${c.id})" class="text-slate-400 p-1"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="p-3 bg-slate-50" onclick="openScanModal(${c.id})">
            <div class="card-canvas-container"><canvas id="cvs_${c.id}" width="400" height="252"></canvas></div>
          </div>
          <div class="px-3 py-2 text-[10px] font-bold text-slate-400">${c.owner} | ${c.category}</div>
        </div>
      `).join('');

      setTimeout(() => filtered.forEach(c => drawCardCanvas(document.getElementById(`cvs_${c.id}`), c)), 50);
    }

    function openSyncSettingsModal() { 
      document.getElementById('syncSettingsModal').classList.remove('hidden-modal');
      document.getElementById('syncSettingsModal').classList.add('active-modal');
    }
    function closeSyncSettingsModal() { 
      document.getElementById('syncSettingsModal').classList.remove('active-modal');
      document.getElementById('syncSettingsModal').classList.add('hidden-modal');
    }
    function applyCustomSyncKey() {
      const v = document.getElementById('syncKeyInput').value.trim();
      if(v) {
        localStorage.setItem('canvas_cards_sync_key', v);
        window.location.reload();
      }
    }

    // --- 其餘輔助函式 (保留裁切與基本邏輯) ---
    function setupImageUploadHandlers() {
      ['imageInput1D', 'imageInput2D'].forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const raw = ev.target.result;
              if (id.includes('1D')) currentRawImageData1D = raw; else currentRawImageData2D = raw;
              openCropModal(raw, (cropped) => {
                if(id.includes('1D')) {
                  currentUploadedImageData1D = cropped;
                  document.getElementById('imagePreview1D').src = cropped;
                  document.getElementById('imagePreviewContainer1D').classList.remove('hidden');
                } else {
                  currentUploadedImageData2D = cropped;
                  document.getElementById('imagePreview2D').src = cropped;
                  document.getElementById('imagePreviewContainer2D').classList.remove('hidden');
                }
              });
            };
            reader.readAsDataURL(file);
          }
        });
      });
    }

    function openCropModal(url, cb) {
      onCropSuccessCallback = cb;
      document.getElementById('cropTargetImage').src = url;
      document.getElementById('cropModal').classList.add('active-modal');
      document.getElementById('cropModal').classList.remove('hidden-modal');
      setTimeout(() => {
        if (cropperInstance) cropperInstance.destroy();
        cropperInstance = new Cropper(document.getElementById('cropTargetImage'), { aspectRatio: 400 / 252, viewMode: 1 });
      }, 100);
    }

    function confirmCrop() {
      const data = cropperInstance.getCroppedCanvas({ width: 500 }).toDataURL('image/jpeg', 0.6);
      onCropSuccessCallback(data);
      closeCropModal();
    }

    function generateBarcodeImage(text, type) {
      return new Promise(resolve => {
        const cvs = document.createElement('canvas');
        if (type === 'QR') { new QRious({ element: cvs, value: text, size: 250 }); resolve(cvs); }
        else { try { JsBarcode(cvs, text, { format: "CODE128", displayValue: false }); resolve(cvs); } catch(e) { resolve(null); } }
      });
    }

    async function handleCardFormSubmit(e) {
      e.preventDefault();
      const card = {
        id: editingCardId || Date.now(), title: document.getElementById('title').value,
        code1D: document.getElementById('code1D').value, code2D: document.getElementById('code2D').value,
        owner: document.getElementById('owner').value, category: document.getElementById('category').value,
        expiryDate: document.getElementById('expiryDate').value, cardColor: document.getElementById('cardColor').value,
        canvasStyle: document.getElementById('canvasStyle').value,
        bgImage1D: currentUploadedImageData1D, bgImage2D: currentUploadedImageData2D,
        rawImage1D: currentRawImageData1D, rawImage2D: currentRawImageData2D,
        activeBarcodeType: document.getElementById('code1D').value || currentUploadedImageData1D ? 'CODE128' : 'QR'
      };
      
      const row = {
        id: card.id, sync_key: window.currentSyncKey, title: card.title, owner: card.owner, category: card.category,
        code1d: card.code1D, code2d: card.code2D, active_barcode_type: card.activeBarcodeType, expiry_date: card.expiry_date,
        card_color: card.cardColor, bg_image1d: card.bgImage1D, bg_image2d: card.bgImage2D, raw_image1d: card.rawImage1D, raw_image2d: card.rawImage2D, updated_at: new Date()
      };

      const { error } = await _db.from('cards').upsert(row);
      if(!error) showToast("雲端同步成功");
      closeAddModal();
    }

    function updateCloudStatusUI(isOnline, text) {
      document.getElementById('cloudStatusText').innerText = text;
      document.getElementById('cloudStatusDot').className = isOnline ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs z-[100]';
      t.innerText = msg; document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function getExpiryStatus(date) {
      if (!date) return { status: 'valid', text: '永久', colorClass: 'text-slate-400' };
      const diff = (new Date(date) - new Date()) / 86400000;
      if (diff < 0) return { status: 'expired', text: '已過期', colorClass: 'text-rose-600' };
      if (diff < 30) return { status: 'warning', text: '即將過期', colorClass: 'text-amber-500' };
      return { status: 'valid', text: '有效', colorClass: 'text-emerald-600' };
    }

    function updateDropdowns() {
      const owners = [...new Set(window.cards.map(c => c.owner))].filter(Boolean);
      const cats = [...new Set(window.cards.map(c => c.category))].filter(Boolean);
      document.getElementById('ownerFilter').innerHTML = '<option value="">持有人</option>' + owners.map(o => `<option value="${o}">${o}</option>`).join('');
      document.getElementById('categoryFilter').innerHTML = '<option value="">分類</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // 全域導出
    window.switchMainTab = (t) => { currentMainTab = t; renderAllCards(); };
    window.openAddModal = () => { editingCardId = null; document.getElementById('cardForm').reset(); document.getElementById('addModal').classList.add('active-modal'); document.getElementById('addModal').classList.remove('hidden-modal'); };
    window.closeAddModal = () => { document.getElementById('addModal').classList.remove('active-modal'); document.getElementById('addModal').classList.add('hidden-modal'); };
    window.openScanModal = (id) => { 
      const c = window.cards.find(x => x.id === id); currentScanCardId = id;
      document.getElementById('scanTitle').innerText = c.title; switchScanBarcodeType(c.activeBarcodeType || 'CODE128');
      document.getElementById('scanModal').classList.add('active-modal'); document.getElementById('scanModal').classList.remove('hidden-modal');
    };
    window.closeScanModal = () => { document.getElementById('scanModal').classList.remove('active-modal'); document.getElementById('scanModal').classList.add('hidden-modal'); };
    window.deleteCard = async (e, id) => { 
      e.stopPropagation(); 
      if(confirm("確定刪除？")) {
        await _db.from('cards').delete().eq('id', id);
        window.cards = window.cards.filter(c => c.id !== id);
        renderAllCards();
      }
    };
    window.closeCropModal = () => { document.getElementById('cropModal').classList.add('hidden-modal'); document.getElementById('cropModal').classList.remove('active-modal'); };
    window.rotateCropImage = (d) => cropperInstance.rotate(d);
    window.switchScanBarcodeType = (type) => {
      const c = window.cards.find(x => x.id === currentScanCardId); c.activeBarcodeType = type;
      drawCardCanvas(document.getElementById('scanCanvas'), c, true);
    };
    window.downloadCanvasPNG = () => { const a = document.createElement('a'); a.download='card.png'; a.href=document.getElementById('scanCanvas').toDataURL(); a.click(); };
  </script>
</body>
</html>
