<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員卡與載具 Canvas 管理器</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Cropper.js (圖片裁切) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Barcode & QR Code 條碼生成庫 -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <!-- ZXing 條碼解碼庫 -->
  <script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

  <!-- Supabase JS Client 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: #f8fafc;
    }
    .card-canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1.586 / 1;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-canvas-container:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.15);
    }
    .modal-overlay {
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .hidden-modal {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .active-modal {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-12">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">會員卡與載具卡包</h1>
          <p class="text-xs text-slate-500">Canvas 智慧管理與雙條碼獨立感應</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="syncStatusBadge" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <i class="fa-solid fa-cloud text-emerald-500"></i> 雲端同步中
        </span>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span class="hidden sm:inline">新增卡片</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="搜尋卡片名稱、號碼或持有人..." class="w-full pl-9 pr-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- 動態繪製卡片 -->
    </div>
  </main>

  <!-- 新增/編輯 Modal -->
  <div id="addModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b pb-3 sticky top-0 bg-white z-10">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-800"><i class="fa-solid fa-credit-card text-blue-600 mr-2"></i>新增會員卡 / 載具</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="cardForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">卡片/店家名稱 *</label>
          <input type="text" id="title" placeholder="如：全聯福利卡、好市多會員卡" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"><i class="fa-solid fa-barcode text-blue-500 mr-1"></i>一維條碼號碼</label>
            <input type="text" id="code1D" placeholder="如：PX123456789" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"><i class="fa-solid fa-qrcode text-blue-500 mr-1"></i>二維碼號碼 (QR)</label>
            <input type="text" id="code2D" placeholder="如：/AB12345" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">持有人 *</label>
            <input type="text" id="owner" placeholder="如：蛋" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">分類標籤 *</label>
            <input type="text" id="category" placeholder="如：超市" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">卡片主題顏色</label>
          <input type="color" id="cardColor" value="#2563eb" class="h-9 w-full rounded cursor-pointer border p-0.5">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition mt-3 shadow">
          儲存卡片
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    const SUPABASE_URL = 'https://msuwmgyvlcaodgpttfcr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_h89jxsCmM3bcTKdHqr5WhA_vGvb-EhS';
    let supabaseClient = null;

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        console.warn('Supabase Client 初始化提醒:', e);
      }
    }

    let cards = [];

    // 開啟/關閉 Modal
    window.openAddModal = () => {
      document.getElementById('cardForm').reset();
      document.getElementById('addModal').classList.remove('hidden-modal');
      document.getElementById('addModal').classList.add('active-modal');
    };

    window.closeAddModal = () => {
      document.getElementById('addModal').classList.remove('active-modal');
      document.getElementById('addModal').classList.add('hidden-modal');
    };

    // 讀取 Supabase 卡片
    async function loadCards() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient.from('cards').select('*').order('id', { ascending: false });
      if (!error && data) {
        cards = data;
        renderCards();
      }
    }

    // 表單提交事件
    document.getElementById('cardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newCard = {
        id: Date.now(),
        title: document.getElementById('title').value,
        code1D: document.getElementById('code1D').value,
        code2D: document.getElementById('code2D').value,
        owner: document.getElementById('owner').value,
        category: document.getElementById('category').value,
        cardColor: document.getElementById('cardColor').value,
        activeBarcodeType: 'CODE128'
      };

      if (supabaseClient) {
        const { error } = await supabaseClient.from('cards').insert([newCard]);
        if (error) {
          alert('儲存失敗：' + error.message);
          return;
        }
      }

      cards.unshift(newCard);
      renderCards();
      closeAddModal();
    });

    // 刪除卡片
    window.deleteCard = async (id) => {
      if (!confirm('確定要刪除這張卡片嗎？')) return;
      if (supabaseClient) {
        await supabaseClient.from('cards').delete().eq('id', id);
      }
      cards = cards.filter(c => c.id !== id);
      renderCards();
    };

    // 渲染卡片至畫面
    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      if (cards.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-8">目前沒有卡片，請點擊右上方「新增卡片」按鈕！</p>';
        return;
      }

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative space-y-3';
        div.style.borderTop = `6px solid ${card.cardColor || '#2563eb'}`;

        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-slate-800 text-base">${card.title}</h3>
              <p class="text-xs text-slate-500">持有人: ${card.owner} | 分類: ${card.category}</p>
            </div>
            <button onclick="deleteCard(${card.id})" class="text-slate-400 hover:text-rose-600 text-sm p-1">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
          <div class="bg-slate-50 p-3 rounded-xl border text-center font-mono text-xs text-slate-600 space-y-1">
            ${card.code1D ? `<div>條碼: ${card.code1D}</div>` : ''}
            ${card.code2D ? `<div>QR: ${card.code2D}</div>` : ''}
          </div>
        `;
        grid.appendChild(div);
      });
    }

    // 搜尋過濾
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = cards.filter(c => 
        c.title.toLowerCase().includes(term) || 
        c.owner.toLowerCase().includes(term) || 
        (c.code1D && c.code1D.toLowerCase().includes(term))
      );
      // 快速重新渲染搜尋結果
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      filtered.forEach(card => {
        const div = document.createElement('div');
        div.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative space-y-3';
        div.style.borderTop = `6px solid ${card.cardColor || '#2563eb'}`;
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-slate-800 text-base">${card.title}</h3>
              <p class="text-xs text-slate-500">持有人: ${card.owner} | 分類: ${card.category}</p>
            </div>
            <button onclick="deleteCard(${card.id})" class="text-slate-400 hover:text-rose-600 text-sm p-1">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
          <div class="bg-slate-50 p-3 rounded-xl border text-center font-mono text-xs text-slate-600 space-y-1">
            ${card.code1D ? `<div>條碼: ${card.code1D}</div>` : ''}
            ${card.code2D ? `<div>QR: ${card.code2D}</div>` : ''}
          </div>
        `;
        grid.appendChild(div);
      });
    });

    loadCards();
  </script>
</body>
</html>
