<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 智慧會員卡包 (Supabase 完美修復版)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Cropper.js (圖片裁切) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <!-- 條碼生成庫 -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; }
    .card-canvas-container {
      position: relative; width: 100%; aspect-ratio: 1.586 / 1;
      border-radius: 1rem; overflow: hidden;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease; cursor: pointer;
    }
    .card-canvas-container:hover { transform: translateY(-2px); }
    .card-canvas-container canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    .modal-overlay { transition: opacity 0.25s ease; }
    .hidden-modal { opacity: 0; pointer-events: none; visibility: hidden; }
    .active-modal { opacity: 1; pointer-events: auto; visibility: visible; }
    
    /* 預覽圖按鈕 */
    .preview-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; }
    .btn-mini { background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 6px; font-size: 10px; transition: 0.2s; }
    .btn-mini:hover { background: #2563eb; }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-12">

  <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-md"><i class="fa-solid fa-paintbrush"></i></div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">Canvas 智慧卡包</h1>
          <p class="text-xs text-slate-500">Supabase 雲端同步系統</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openSyncSettingsModal()" id="cloudStatusBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 border transition flex items-center gap-1.5">
          <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="cloudStatusText">連線中...</span>
        </button>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i><span class="hidden sm:inline">新增卡片</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-5">
    <!-- 切換與搜尋 -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1">
      <button id="tabAll" onclick="switchMainTab('all')" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white">全部 <span id="countAll">0</span></button>
      <button id="tabExpiring" onclick="switchMainTab('expiring')" class="px-4 py-2 rounded-xl text-xs font-medium bg-white border">即將過期 <span id="countExpiring">0</span></button>
      <button id="tabValid" onclick="switchMainTab('valid')" class="px-4 py-2 rounded-xl text-xs font-medium bg-white border">有效 <span id="countValid">0</span></button>
    </div>

    <div class="bg-white p-4 rounded-2xl border shadow-sm flex flex-col md:flex-row gap-3">
      <input type="text" id="searchInput" placeholder="搜尋名稱、持有者..." class="flex-1 px-4 py-2 text-xs border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
      <div class="grid grid-cols-2 gap-2">
        <select id="ownerFilter" class="px-2 py-2 text-xs border rounded-xl bg-white outline-none"><option value="">持有人</option></select>
        <select id="categoryFilter" class="px-2 py-2 text-xs border rounded-xl bg-white outline-none"><option value="">分類</option></select>
      </div>
    </div>

    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- 新增/編輯 Modal -->
  <div id="addModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b pb-3 sticky top-0 bg-white">
        <h3 id="modalTitle" class="font-bold text-slate-800">卡片編輯</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="cardForm" class="space-y-4">
        <input type="text" id="title" placeholder="卡片名稱" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="code1D" placeholder="一維條碼號碼" class="px-3 py-2 border rounded-lg text-sm font-mono">
          <input type="text" id="code2D" placeholder="二維碼 (QR) 號碼" class="px-3 py-2 border rounded-lg text-sm font-mono">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="owner" placeholder="持有人" required class="px-3 py-2 border rounded-lg text-sm">
          <input type="text" id="category" placeholder="分類" required class="px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <input type="date" id="expiryDate" class="px-3 py-2 border rounded-lg text-sm">
          <select id="canvasStyle" class="px-3 py-2 border rounded-lg text-sm bg-white">
            <option value="gradient">經典漸層</option>
            <option value="chip">尊榮黑金</option>
            <option value="pattern">幾何網格</option>
            <option value="wave">流動水波</option>
          </select>
        </div>
        <div class="flex items-center gap-3">
          <label class="text-xs font-bold text-slate-600">配色：</label>
          <input type="color" id="cardColor" value="#2563eb" class="h-9 w-full rounded cursor-pointer border p-0.5">
        </div>
        
        <!-- 圖片上傳預覽區 -->
        <div class="grid grid-cols-2 gap-3">
          <div class="relative border-2 border-dashed p-3 rounded-xl text-center bg-slate-50">
            <div id="dropZone1D" onclick="document.getElementById('imageInput1D').click()" class="cursor-pointer">
              <span class="text-[10px] font-bold block text-slate-500">條碼照片</span>
              <input type="file" id="imageInput1D" accept="image/*" class="hidden">
            </div>
            <div id="imagePreviewContainer1D" class="hidden relative h-24 mt-1 bg-white border rounded overflow-hidden">
              <img id="imagePreview1D" class="h-full w-full object-contain">
              <div class="preview-actions">
                <button type="button" onclick="reCropExistingImage('1D')" class="btn-mini"><i class="fa-solid fa-crop"></i></button>
                <button type="button" onclick="clearImagePreview('1D')" class="btn-mini"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
          <div class="relative border-2 border-dashed p-3 rounded-xl text-center bg-slate-50">
            <div id="dropZone2D" onclick="document.getElementById('imageInput2D').click()" class="cursor-pointer">
              <span class="text-[10px] font-bold block text-slate-500">QR 照片</span>
              <input type="file" id="imageInput2D" accept="image/*" class="hidden">
            </div>
            <div id="imagePreviewContainer2D" class="hidden relative h-24 mt-1 bg-white border rounded overflow-hidden">
              <img id="imagePreview2D" class="h-full w-full object-contain">
              <div class="preview-actions">
                <button type="button" onclick="reCropExistingImage('2D')" class="btn-mini"><i class="fa-solid fa-crop"></i></button>
                <button type="button" onclick="clearImagePreview('2D')" class="btn-mini"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl shadow-lg">儲存並同步雲端</button>
      </form>
    </div>
  </div>

  <!-- 放大掃描 Modal -->
  <div id="scanModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl text-center relative">
      <button onclick="closeScanModal()" class="absolute right-4 top-4 text-slate-400 text-2xl hover:text-slate-600"><i class="fa-solid fa-circle-xmark"></i></button>
      <h3 id="scanTitle" class="text-2xl font-bold mb-1"></h3>
      <p id="scanMeta" class="text-xs text-slate-500 mb-4"></p>
      <div class="flex justify-center gap-2 mb-4 bg-slate-100 p-1 rounded-xl w-fit mx-auto">
        <button id="scanBtn1D" onclick="switchScanBarcodeType('CODE128')" class="px-6 py-2 rounded-lg text-xs font-bold transition">一維條碼</button>
        <button id="scanBtnQR" onclick="switchScanBarcodeType('QR')" class="px-6 py-2 rounded-lg text-xs font-bold transition">二維碼 (QR)</button>
      </div>
      <canvas id="scanCanvas" class="w-full h-auto rounded-xl border-2 border-slate-100 shadow-inner mb-4"></canvas>
      <button onclick="downloadCanvasPNG()" class="text-xs font-bold text-blue-600 bg-blue-50 px-6 py-2 rounded-xl"><i class="fa-solid fa-download mr-1"></i> 下載感應圖片</button>
    </div>
  </div>

  <!-- 裁切 Modal -->
  <div id="cropModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[60] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl flex flex-col gap-4">
      <h3 class="font-bold border-b pb-2">裁切條碼範圍</h3>
      <div class="relative bg-slate-900 h-[300px] flex items-center justify-center rounded-lg overflow-hidden">
        <img id="cropTargetImage" class="max-h-full">
      </div>
      <div class="flex justify-between items-center">
        <div class="flex gap-2">
          <button onclick="rotateCropImage(-90)" class="bg-slate-100 p-2 rounded-lg"><i class="fa-solid fa-rotate-left"></i></button>
          <button onclick="rotateCropImage(90)" class="bg-slate-100 p-2 rounded-lg"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <div class="flex gap-2">
          <button onclick="closeCropModal(false)" class="px-4 py-2 text-xs font-bold text-slate-500">取消</button>
          <button onclick="confirmCrop()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold shadow-md">確認裁切</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 同步設定 Modal -->
  <div id="syncSettingsModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <h3 class="font-bold border-b pb-2">雲端同步設定</h3>
      <div class="bg-blue-50 p-4 rounded-xl space-y-2">
        <label class="text-xs font-bold block text-blue-800">同步暗號 (各裝置輸入相同代碼即可同步)</label>
        <div class="flex gap-2">
          <input type="text" id="syncKeyInput" class="flex-1 px-3 py-2 text-sm border rounded-xl font-mono outline-none">
          <button onclick="applyCustomSyncKey()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">儲存配對</button>
        </div>
      </div>
      <button onclick="pushLocalCardsToCloud()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-md">上傳本機資料到雲端</button>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportCardsJSON()" class="bg-slate-100 py-2 rounded-xl text-xs font-bold">匯出備份</button>
        <button onclick="document.getElementById('importJsonFileInput').click()" class="bg-slate-100 py-2 rounded-xl text-xs font-bold">匯入備份</button>
        <input type="file" id="importJsonFileInput" accept=".json" class="hidden" onchange="importCardsJSON(event)">
      </div>
      <button onclick="closeSyncSettingsModal()" class="w-full text-slate-400 text-xs py-2">關閉</button>
    </div>
  </div>

  <!-- 刪除確認 Modal -->
  <div id="deleteModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl text-center space-y-4 max-w-xs w-full shadow-2xl border">
      <h4 class="font-bold">確定要刪除卡片嗎？</h4>
      <div class="flex gap-2">
        <button onclick="closeDeleteModal()" class="flex-1 bg-slate-100 py-2 rounded-xl text-xs font-bold">取消</button>
        <button onclick="confirmDeleteCard()" class="flex-1 bg-rose-600 text-white py-2 rounded-xl text-xs font-bold">確認刪除</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Supabase 初始化 ---
    const SUPABASE_URL = 'https://msuwmgyvlcaodgpttfcr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_h89jxsCmM3bcTKdHqr5WhA_vGvb-EhS';
    const _db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- 2. 狀態管理 ---
    window.cards = [];
    let currentMainTab = 'all';
    let editingCardId = null;
    let pendingDeleteId = null;
    let currentScanCardId = null;
    let cropperInstance = null;
    let onCropSuccessCallback = null;

    let currentUploadedImageData1D = '';
    let currentUploadedImageData2D = '';
    let currentRawImageData1D = ''; // 儲存原始大圖
    let currentRawImageData2D = '';

    // --- 3. 啟動與同步 ---
    window.addEventListener('DOMContentLoaded', () => {
      window.currentSyncKey = localStorage.getItem('canvas_cards_sync_key') || 'common-wallet-room';
      document.getElementById('syncKeyInput').value = window.currentSyncKey;
      
      document.getElementById('cardForm').addEventListener('submit', handleCardFormSubmit);
      document.getElementById('searchInput').addEventListener('input', renderAllCards);
      
      setupImageUploadHandlers();
      initCloudSync();
    });

    async function initCloudSync() {
      updateCloudStatusUI(false, '雲端連線中...');
      await fetchCardsFromCloud();

      _db.channel('cards_room')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'cards', filter: `sync_key=eq.${window.currentSyncKey}` }, () => {
          fetchCardsFromCloud(); 
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') updateCloudStatusUI(true, `已同步：${window.currentSyncKey}`);
        });
    }

    async function fetchCardsFromCloud() {
      const { data, error } = await _db.from('cards').select('*').eq('sync_key', window.currentSyncKey);
      if (error) return;
      if (data) {
        window.cards = data.map(dbRow => ({
          id: parseInt(dbRow.id),
          title: dbRow.title,
          owner: dbRow.owner,
          category: dbRow.category,
          code1D: dbRow.code1d || '',
          code2D: dbRow.code2d || '',
          activeBarcodeType: dbRow.active_barcode_type || 'CODE128',
          expiryDate: dbRow.expiry_date || '',
          cardColor: dbRow.card_color || '#2563eb',
          canvasStyle: dbRow.canvas_style || 'gradient',
          bgImage1D: dbRow.bg_image1d || '',
          bgImage2D: dbRow.bg_image2d || '',
          rawImage1D: dbRow.raw_image1d || '',
          rawImage2D: dbRow.raw_image2d || '',
          syncKey: dbRow.sync_key
        }));
        updateDropdowns();
        renderAllCards();
      }
    }

    window.saveCardToCloud = async function(card) {
      const row = {
        id: card.id, sync_key: window.currentSyncKey, title: card.title, owner: card.owner, category: card.category,
        code1d: card.code1D, code2d: card.code2D, active_barcode_type: card.activeBarcodeType, expiry_date: card.expiryDate,
        card_color: card.cardColor, canvas_style: card.canvasStyle, bg_image1d: card.bgImage1D, bg_image2d: card.bgImage2D,
        raw_image1d: card.rawImage1D, raw_image2d: card.rawImage2D, updated_at: new Date()
      };
      const { error } = await _db.from('cards').upsert(row);
      if (error) showToast('⚠️ 儲存失敗 (圖片過大)');
      else showToast('☁️ 雲端同步成功');
    };

    // --- 4. 繪圖核心 (防止變形) ---
    async function drawCardCanvas(canvas, card, isScan = false) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      
      ctx.fillStyle = isScan ? '#ffffff' : card.cardColor;
      ctx.fillRect(0, 0, w, h);

      if (!isScan) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(card.title || '未命名', 20, 45);
      }

      const activeType = card.activeBarcodeType || 'CODE128';
      const code = (activeType === 'QR' ? card.code2D : card.code1D) || '';
      const bgImgSrc = (activeType === 'QR' ? card.bgImage2D : card.bgImage1D);

      const margin = 15;
      const boxH = isScan ? h - 40 : h * 0.65;
      const boxY = h - boxH - margin;
      const boxW = w - margin * 2;
      
      ctx.fillStyle = '#ffffff';
      if (ctx.roundRect) ctx.roundRect(margin, boxY, boxW, boxH, 10);
      else ctx.fillRect(margin, boxY, boxW, boxH);
      ctx.fill();

      if (bgImgSrc) {
        const img = new Image();
        img.src = bgImgSrc;
        await new Promise(r => img.onload = r);
        
        // 防止變形計算 (Contain 邏輯)
        const pad = 10;
        const maxW = boxW - pad * 2;
        const maxH = boxH - pad * 2;
        const ratio = Math.min(maxW / img.width, maxH / img.height);
        
        const drawW = img.width * ratio;
        const drawH = img.height * ratio;
        const drawX = margin + (boxW - drawW) / 2;
        const drawY = boxY + (boxH - drawH) / 2;

        ctx.drawImage(img, drawX, drawY, drawW, drawH);
      } else if (code) {
        const bcImg = await generateBarcodeImage(code, activeType);
        if (bcImg) {
          const drawH = activeType === 'QR' ? boxH * 0.8 : boxH * 0.6;
          const drawW = activeType === 'QR' ? drawH : boxW * 0.9;
          ctx.drawImage(bcImg, (w - drawW)/2, boxY + (boxH - drawH)/2, drawW, drawH);
        }
      }
    }

    // --- 5. 圖片處理 (裁切與重新編輯) ---
    function setupImageUploadHandlers() {
      ['imageInput1D', 'imageInput2D'].forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const raw = ev.target.result;
            if (id.includes('1D')) currentRawImageData1D = raw;
            else currentRawImageData2D = raw;
            
            openCropModal(raw, (cropped) => {
              const type = id.includes('1D') ? '1D' : '2D';
              updateImagePreview(type, cropped);
            });
          };
          reader.readAsDataURL(file);
        });
      });
    }

    function reCropExistingImage(type) {
      const raw = (type === '1D') ? currentRawImageData1D : currentRawImageData2D;
      if (!raw) return showToast('找不到原始圖片');
      openCropModal(raw, (cropped) => {
        updateImagePreview(type, cropped);
      });
    }

    function updateImagePreview(type, data) {
      if (type === '1D') {
        currentUploadedImageData1D = data;
        document.getElementById('imagePreview1D').src = data;
        document.getElementById('imagePreviewContainer1D').classList.remove('hidden');
      } else {
        currentUploadedImageData2D = data;
        document.getElementById('imagePreview2D').src = data;
        document.getElementById('imagePreviewContainer2D').classList.remove('hidden');
      }
    }

    function clearImagePreview(type) {
      if (type === '1D') {
        currentUploadedImageData1D = ''; currentRawImageData1D = '';
        document.getElementById('imagePreviewContainer1D').classList.add('hidden');
      } else {
        currentUploadedImageData2D = ''; currentRawImageData2D = '';
        document.getElementById('imagePreviewContainer2D').classList.add('hidden');
      }
    }

    function openCropModal(url, cb) {
      onCropSuccessCallback = cb;
      document.getElementById('cropTargetImage').src = url;
      document.getElementById('cropModal').classList.add('active-modal');
      setTimeout(() => {
        if (cropperInstance) cropperInstance.destroy();
        cropperInstance = new Cropper(document.getElementById('cropTargetImage'), { aspectRatio: 400 / 252, viewMode: 1 });
      }, 100);
    }

    function confirmCrop() {
      const data = cropperInstance.getCroppedCanvas({ width: 500 }).toDataURL('image/jpeg', 0.6);
      onCropSuccessCallback(data);
      closeCropModal();
    }

    // --- 6. 介面控制 ---
    function handleCardFormSubmit(e) {
      e.preventDefault();
      const card = {
        id: editingCardId || Date.now(),
        title: document.getElementById('title').value,
        code1D: document.getElementById('code1D').value,
        code2D: document.getElementById('code2D').value,
        owner: document.getElementById('owner').value,
        category: document.getElementById('category').value,
        expiryDate: document.getElementById('expiryDate').value,
        cardColor: document.getElementById('cardColor').value,
        canvasStyle: document.getElementById('canvasStyle').value,
        bgImage1D: currentUploadedImageData1D, bgImage2D: currentUploadedImageData2D,
        rawImage1D: currentRawImageData1D, rawImage2D: currentRawImageData2D,
        activeBarcodeType: document.getElementById('code1D').value || currentUploadedImageData1D ? 'CODE128' : 'QR'
      };
      window.saveCardToCloud(card);
      closeAddModal();
    }

    function renderAllCards() {
      const container = document.getElementById('cardGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = window.cards.filter(c => c.title.toLowerCase().includes(search) || c.owner.toLowerCase().includes(search));
      
      container.innerHTML = filtered.map(c => `
        <div class="bg-white rounded-2xl border shadow-sm overflow-hidden flex flex-col group">
          <div class="p-3 flex justify-between border-b">
            <span class="font-bold text-sm">${c.title}</span>
            <div class="flex gap-1">
              <button onclick="openEditModal(event, ${c.id})" class="text-slate-400 hover:text-blue-600 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deleteCard(event, ${c.id})" class="text-slate-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="p-3 bg-slate-50" onclick="openScanModal(${c.id})">
            <div class="card-canvas-container"><canvas id="cvs_${c.id}" width="400" height="252"></canvas></div>
          </div>
          <div class="px-3 py-2 text-[10px] font-bold text-slate-400">${c.owner} | ${c.category}</div>
        </div>
      `).join('');

      setTimeout(() => filtered.forEach(c => drawCardCanvas(document.getElementById(`cvs_${c.id}`), c)), 50);
      document.getElementById('countAll').innerText = window.cards.length;
    }

    function openEditModal(e, id) {
      e.stopPropagation();
      const c = window.cards.find(x => x.id === id);
      editingCardId = id;
      document.getElementById('title').value = c.title;
      document.getElementById('code1D').value = c.code1D;
      document.getElementById('code2D').value = c.code2D;
      document.getElementById('owner').value = c.owner;
      document.getElementById('category').value = c.category;
      document.getElementById('expiryDate').value = c.expiryDate;
      document.getElementById('cardColor').value = c.cardColor;
      
      currentUploadedImageData1D = c.bgImage1D; currentRawImageData1D = c.rawImage1D || c.bgImage1D;
      currentUploadedImageData2D = c.bgImage2D; currentRawImageData2D = c.rawImage2D || c.bgImage2D;
      
      if(c.bgImage1D) { document.getElementById('imagePreview1D').src = c.bgImage1D; document.getElementById('imagePreviewContainer1D').classList.remove('hidden'); }
      if(c.bgImage2D) { document.getElementById('imagePreview2D').src = c.bgImage2D; document.getElementById('imagePreviewContainer2D').classList.remove('hidden'); }
      
      document.getElementById('addModal').classList.add('active-modal');
    }

    function openScanModal(id) {
      const c = window.cards.find(x => x.id === id);
      currentScanCardId = id;
      document.getElementById('scanTitle').innerText = c.title;
      switchScanBarcodeType(c.activeBarcodeType || 'CODE128');
      document.getElementById('scanModal').classList.add('active-modal');
    }

    function switchScanBarcodeType(type) {
      const c = window.cards.find(x => x.id === currentScanCardId);
      c.activeBarcodeType = type;
      document.getElementById('scanBtn1D').className = type==='CODE128' ? 'px-6 py-2 rounded-lg text-xs font-bold bg-blue-600 text-white' : 'px-6 py-2 rounded-lg text-xs font-bold bg-white text-slate-500';
      document.getElementById('scanBtnQR').className = type==='QR' ? 'px-6 py-2 rounded-lg text-xs font-bold bg-blue-600 text-white' : 'px-6 py-2 rounded-lg text-xs font-bold bg-white text-slate-500';
      drawCardCanvas(document.getElementById('scanCanvas'), c, true);
    }

    // --- 輔助工具 ---
    function generateBarcodeImage(text, type) {
      return new Promise(resolve => {
        const cvs = document.createElement('canvas');
        if (type === 'QR') { new QRious({ element: cvs, value: text, size: 250 }); resolve(cvs); }
        else { try { JsBarcode(cvs, text, { format: "CODE128", displayValue: false }); resolve(cvs); } catch(e) { resolve(null); } }
      });
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs z-[100] shadow-2xl';
      t.innerText = msg; document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function updateCloudStatusUI(isOnline, text) {
      document.getElementById('cloudStatusText').innerText = text;
      document.getElementById('cloudStatusDot').className = isOnline ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
    }

    function getExpiryStatus(date) {
      if (!date) return { status: 'valid', text: '永久', colorClass: 'text-slate-400' };
      const diff = (new Date(date) - new Date()) / 86400000;
      if (diff < 0) return { status: 'expired', text: '已過期', colorClass: 'text-rose-600' };
      if (diff < 30) return { status: 'warning', text: '即將過期', colorClass: 'text-amber-500' };
      return { status: 'valid', text: '有效', colorClass: 'text-emerald-600' };
    }

    // 全域導出
    window.switchMainTab = (t) => { currentMainTab = t; renderAllCards(); };
    window.openAddModal = () => { editingCardId = null; document.getElementById('cardForm').reset(); clearImagePreview('1D'); clearImagePreview('2D'); document.getElementById('addModal').classList.add('active-modal'); };
    window.closeAddModal = () => document.getElementById('addModal').classList.remove('active-modal');
    window.closeScanModal = () => document.getElementById('scanModal').classList.remove('active-modal');
    window.deleteCard = (e, id) => { e.stopPropagation(); pendingDeleteId = id; document.getElementById('deleteModal').classList.add('active-modal'); };
    window.closeDeleteModal = () => document.getElementById('deleteModal').classList.remove('active-modal');
    window.confirmDeleteCard = async () => { if(pendingDeleteId) { await _db.from('cards').delete().eq('id', pendingDeleteId); window.cards = window.cards.filter(c => c.id !== pendingDeleteId); renderAllCards(); } closeDeleteModal(); };
    window.openSyncSettingsModal = () => document.getElementById('syncSettingsModal').classList.add('active-modal');
    window.closeSyncSettingsModal = () => document.getElementById('syncSettingsModal').classList.remove('active-modal');
    window.closeCropModal = () => document.getElementById('cropModal').classList.remove('active-modal');
    window.rotateCropImage = (d) => cropperInstance.rotate(d);
    window.applyCustomSyncKey = () => { const v = document.getElementById('syncKeyInput').value; if(v){ localStorage.setItem('canvas_cards_sync_key', v); location.reload(); } };
    window.updateDropdowns = () => {
      const owners = [...new Set(window.cards.map(c => c.owner))];
      document.getElementById('ownerFilter').innerHTML = '<option value="">持有人</option>' + owners.map(o => `<option value="${o}">${o}</option>`).join('');
    };
    window.downloadCanvasPNG = () => { const a = document.createElement('a'); a.download='card.png'; a.href=document.getElementById('scanCanvas').toDataURL(); a.click(); };
  </script>
</body>
</html>
