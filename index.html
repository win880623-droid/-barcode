<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員卡與載具 Canvas 管理器</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Cropper.js (圖片裁切) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Barcode & QR Code 條碼生成庫 -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <!-- ZXing 條碼解碼庫 (自動辨識圖片條碼) -->
  <script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

  <!-- Supabase JS Client 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: #f8fafc;
    }
    .card-canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1.586 / 1; /* 標準黃金卡片比例 */
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-canvas-container:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.15);
    }
    .card-canvas-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .modal-overlay {
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .hidden-modal {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .active-modal {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    /* 優化 Cropper.js 裁切框與觸控拖曳控制點 */
    .cropper-view-box {
      outline: 2px solid #2563eb !important;
      outline-color: rgba(37, 99, 235, 0.85) !important;
    }
    .cropper-line {
      background-color: #2563eb !important;
    }
    .cropper-point {
      background-color: #2563eb !important;
      width: 12px !important;
      height: 12px !important;
      opacity: 0.95 !important;
      border-radius: 50% !important;
      border: 2px solid #ffffff !important;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3) !important;
    }
    .cropper-point.point-e, .cropper-point.point-w {
      margin-top: -5px !important;
      width: 10px !important;
      height: 16px !important;
      border-radius: 4px !important;
    }
    .cropper-point.point-n, .cropper-point.point-s {
      margin-left: -5px !important;
      width: 16px !important;
      height: 10px !important;
      border-radius: 4px !important;
    }
    .cropper-point.point-ne, .cropper-point.point-nw, .cropper-point.point-se, .cropper-point.point-sw {
      width: 14px !important;
      height: 14px !important;
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-12">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
          <i class="fa-solid fa-paintbrush"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">Canvas 智慧會員卡包</h1>
          <p class="text-xs text-slate-500">純 HTML5 Canvas 動態繪製與高畫質條碼管理</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openSyncSettingsModal()" id="syncStatusBadge" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:opacity-90 transition cursor-pointer" title="點擊設定雲端同步與金鑰">
          <i class="fa-solid fa-cloud text-emerald-500"></i> 雲端同步中
        </button>
        <button onclick="openSyncSettingsModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5" title="雲端同步與備份設定">
          <i class="fa-solid fa-gear text-slate-500"></i>
          <span class="hidden sm:inline">同步設定</span>
        </button>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span class="hidden sm:inline">新增卡片</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-5">

    <div class="flex items-center gap-2 overflow-x-auto pb-1">
      <button id="tabAll" onclick="switchMainTab('all')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap bg-blue-600 text-white shadow-sm">
        <i class="fa-solid fa-layer-group"></i>
        <span>全部卡片</span>
        <span id="countAll" class="px-1.5 py-0.5 rounded-full text-[10px] bg-white/20 text-white">0</span>
      </button>

      <button id="tabExpiring" onclick="switchMainTab('expiring')" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-2 whitespace-nowrap bg-white border border-slate-200">
        <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
        <span>即將與已過期</span>
        <span id="countExpiring" class="px-1.5 py-0.5 rounded-full text-[10px] bg-amber-100 text-amber-800 font-bold">0</span>
      </button>

      <button id="tabValid" onclick="switchMainTab('valid')" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-2 whitespace-nowrap bg-white border border-slate-200">
        <i class="fa-solid fa-circle-check text-emerald-500"></i>
        <span>有效卡片</span>
        <span id="countValid" class="px-1.5 py-0.5 rounded-full text-[10px] bg-slate-100 text-slate-600">0</span>
      </button>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="搜尋卡片名稱、號碼或持有人..." class="w-full pl-9 pr-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-3 gap-2 md:w-auto">
        <select id="ownerFilter" class="px-2.5 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
          <option value="">所有持有人</option>
        </select>
        <select id="categoryFilter" class="px-2.5 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
          <option value="">所有種類標籤</option>
        </select>
        <select id="expiryFilter" class="px-2.5 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
          <option value="">所有效期狀態</option>
          <option value="valid">有效中 (含無期限)</option>
          <option value="warning">即將到期 (30天內)</option>
          <option value="expired">已過期</option>
        </select>
      </div>
    </div>

    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- 動態繪製卡片於此 -->
    </div>
  </main>

  <div id="addModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b pb-3 sticky top-0 bg-white z-10">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-800"><i class="fa-solid fa-credit-card text-blue-600 mr-2"></i>新增會員卡 / 載具</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="cardForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">卡片/店家名稱 *</label>
          <input type="text" id="title" list="titleList" placeholder="如：全聯福利卡、好市多會員卡" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          <datalist id="titleList"></datalist>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">
              <i class="fa-solid fa-barcode text-blue-500 mr-1"></i>一維條碼號碼
            </label>
            <input type="text" id="code1D" placeholder="如：PX123456789 (選填)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">
              <i class="fa-solid fa-qrcode text-blue-500 mr-1"></i>二維碼號碼 (QR)
            </label>
            <input type="text" id="code2D" placeholder="如：/AB12345 (選填)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">持有人 (自訂人名) *</label>
            <input type="text" id="owner" list="ownerList" placeholder="如：蛋、媽媽" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <datalist id="ownerList"></datalist>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">分類標籤 *</label>
            <input type="text" id="category" list="categoryList" placeholder="如：電子發票、超市" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <datalist id="categoryList"></datalist>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">到期期限 / 有效日期</label>
            <input type="date" id="expiryDate" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Canvas 背景藝術樣式</label>
            <select id="canvasStyle" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="gradient">經典漸層 (Linear Gradient)</option>
              <option value="chip">尊榮黑金 IC 晶片卡 (Black VIP)</option>
              <option value="pattern">幾何幾何網格 (Geometric Pattern)</option>
              <option value="wave">水波動態流線 (Wave Flow)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">卡片主題純色</label>
            <div class="flex items-center gap-2">
              <input type="color" id="cardColor" value="#2563eb" class="h-9 w-12 rounded cursor-pointer border p-0.5">
              <span class="text-xs text-slate-500">（基底配色）</span>
            </div>
          </div>
        </div>

        <hr class="border-slate-200 my-2">

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-2">
            <i class="fa-solid fa-images text-blue-600 mr-1.5"></i>上傳條碼實體圖片（同張卡片可分開上傳兩張）
          </label>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="border border-slate-200 rounded-xl p-3 bg-slate-50/80 hover:bg-slate-50 transition">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
                  <i class="fa-solid fa-barcode text-blue-600"></i> 一維條碼圖片
                </span>
              </div>

              <div id="dropZone1D" class="border-2 border-dashed border-slate-300 rounded-lg p-2.5 text-center bg-white cursor-pointer hover:border-blue-400 transition" onclick="document.getElementById('imageInput1D').click()">
                <input type="file" id="imageInput1D" accept="image/jpeg, image/png, image/webp, image/gif, image/heic, image/*" class="hidden">
                <input type="file" id="cameraInput1D" accept="image/jpeg, image/png, image/webp, image/heic, image/*" capture="environment" class="hidden">
                
                <p class="text-[11px] text-slate-500 mb-1.5">點擊開啟相簿或拍照</p>
                <div class="flex justify-center gap-1.5">
                  <button type="button" onclick="event.stopPropagation(); document.getElementById('imageInput1D').click()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1">
                    <i class="fa-solid fa-images text-blue-500"></i> 相簿
                  </button>
                  <button type="button" onclick="event.stopPropagation(); document.getElementById('cameraInput1D').click()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1">
                    <i class="fa-solid fa-camera text-emerald-500"></i> 拍照
                  </button>
                </div>
              </div>

              <div id="imagePreviewContainer1D" class="hidden relative rounded-lg border border-slate-200 overflow-hidden bg-slate-900 h-24 flex items-center justify-center mt-2">
                <img id="imagePreview1D" src="" class="max-h-full max-w-full object-contain">
                <div class="absolute top-1 right-1 flex items-center gap-1">
                  <button type="button" onclick="reCropExistingImage('1D')" class="bg-slate-900/80 text-white rounded-full p-1 text-[10px] hover:bg-blue-600 transition" title="重新裁切/旋轉圖片">
                    <i class="fa-solid fa-crop w-3.5 h-3.5 flex items-center justify-center"></i>
                  </button>
                  <button type="button" onclick="clearImagePreview('1D')" class="bg-slate-900/80 text-white rounded-full p-1 text-[10px] hover:bg-rose-600 transition" title="刪除圖片">
                    <i class="fa-solid fa-xmark w-3.5 h-3.5 flex items-center justify-center"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="border border-slate-200 rounded-xl p-3 bg-slate-50/80 hover:bg-slate-50 transition">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
                  <i class="fa-solid fa-qrcode text-emerald-600"></i> 二維碼 (QR) 圖片
                </span>
              </div>

              <div id="dropZone2D" class="border-2 border-dashed border-slate-300 rounded-lg p-2.5 text-center bg-white cursor-pointer hover:border-emerald-400 transition" onclick="document.getElementById('imageInput2D').click()">
                <input type="file" id="imageInput2D" accept="image/jpeg, image/png, image/webp, image/gif, image/heic, image/*" class="hidden">
                <input type="file" id="cameraInput2D" accept="image/jpeg, image/png, image/webp, image/heic, image/*" capture="environment" class="hidden">
                
                <p class="text-[11px] text-slate-500 mb-1.5">點擊開啟相簿或拍照</p>
                <div class="flex justify-center gap-1.5">
                  <button type="button" onclick="event.stopPropagation(); document.getElementById('imageInput2D').click()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1">
                    <i class="fa-solid fa-images text-blue-500"></i> 相簿
                  </button>
                  <button type="button" onclick="event.stopPropagation(); document.getElementById('cameraInput2D').click()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1">
                    <i class="fa-solid fa-camera text-emerald-500"></i> 拍照
                  </button>
                </div>
              </div>

              <div id="imagePreviewContainer2D" class="hidden relative rounded-lg border border-slate-200 overflow-hidden bg-slate-900 h-24 flex items-center justify-center mt-2">
                <img id="imagePreview2D" src="" class="max-h-full max-w-full object-contain">
                <div class="absolute top-1 right-1 flex items-center gap-1">
                  <button type="button" onclick="reCropExistingImage('2D')" class="bg-slate-900/80 text-white rounded-full p-1 text-[10px] hover:bg-emerald-600 transition" title="重新裁切/旋轉圖片">
                    <i class="fa-solid fa-crop w-3.5 h-3.5 flex items-center justify-center"></i>
                  </button>
                  <button type="button" onclick="clearImagePreview('2D')" class="bg-slate-900/80 text-white rounded-full p-1 text-[10px] hover:bg-rose-600 transition" title="刪除圖片">
                    <i class="fa-solid fa-xmark w-3.5 h-3.5 flex items-center justify-center"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" id="submitCardBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition mt-3 shadow">
          Canvas 繪製並儲存卡片
        </button>
      </form>
    </div>
  </div>

  <div id="scanModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl text-center relative">
      <button onclick="closeScanModal()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 text-2xl">
        <i class="fa-solid fa-circle-xmark"></i>
      </button>

      <h3 id="scanTitle" class="text-2xl font-bold text-slate-800 mb-1">卡片名稱</h3>
      <p id="scanMeta" class="text-xs text-slate-500 mb-3"></p>

      <div id="scanBarcodeToggleGroup" class="flex justify-center items-center gap-2 mb-4 bg-slate-100 p-1.5 rounded-2xl w-fit mx-auto border border-slate-200">
        <button id="scanBtn1D" type="button" onclick="switchScanBarcodeType('CODE128')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-barcode"></i> 一維條碼
        </button>
        <button id="scanBtnQR" type="button" onclick="switchScanBarcodeType('QR')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-qrcode"></i> 二維碼 (QR)
        </button>
      </div>

      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 shadow-inner mb-4 flex justify-center">
        <canvas id="scanCanvas" width="600" height="378" class="w-full h-auto rounded-xl max-h-[60vh] object-contain"></canvas>
      </div>

      <div class="flex items-center justify-between gap-3">
        <button onclick="downloadCanvasPNG()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-4 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-download text-blue-600"></i> 下載 Canvas PNG
        </button>
        <div class="text-emerald-600 bg-emerald-50 border border-emerald-200 rounded-xl py-2 px-3 text-xs font-semibold flex items-center justify-center gap-2 flex-1">
          <i class="fa-solid fa-bolt"></i> 高對比度感應優化中
        </div>
      </div>
    </div>
  </div>

  <div id="cropModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[60] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl flex flex-col gap-4 max-h-[90vh]">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-crop text-blue-600"></i> 調整圖片區域 (Canvas 適配)
        </h3>
        <button onclick="closeCropModal(false)" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="flex items-center justify-between text-xs bg-slate-50 p-2.5 rounded-lg border border-slate-200">
        <span class="font-semibold text-slate-700"><i class="fa-solid fa-sliders text-blue-500 mr-1"></i>裁切比例：</span>
        <div class="flex items-center gap-3">
          <label class="inline-flex items-center gap-1 cursor-pointer">
            <input type="radio" name="cropAspect" value="fixed" checked onchange="toggleCropAspectRatio(true)" class="text-blue-600 focus:ring-blue-500">
            <span class="text-slate-700 font-medium">黃金比例</span>
          </label>
          <label class="inline-flex items-center gap-1 cursor-pointer">
            <input type="radio" name="cropAspect" value="free" onchange="toggleCropAspectRatio(false)" class="text-blue-600 focus:ring-blue-500">
            <span class="text-slate-700 font-medium">自由框選</span>
          </label>
        </div>
      </div>

      <div class="relative bg-slate-900 rounded-xl overflow-hidden h-[320px] w-full flex items-center justify-center p-2">
        <img id="cropTargetImage" class="max-h-full max-w-full object-contain" src="" alt="裁切圖片目標">

      <div class="flex items-center justify-between gap-3 pt-2">

          <button type="button" onclick="rotateCropImage(-90)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1">

          <button type="button" onclick="rotateCropImage(90)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i> 右轉

  <div id="deleteModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl text-center space-y-4">

  <div id="syncSettingsModal" class="modal-overlay hidden-modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-blue-600"></i> 雲端同步與 Canvas 備份設定
        </h3>
        <button onclick="closeSyncSettingsModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
        <label class="block text-xs font-bold text-slate-700">
          <i class="fa-solid fa-key text-amber-500 mr-1"></i> 跨裝置同步房號 (Sync Room Key)
        </label>
        <div class="flex gap-2">
          <input type="text" id="syncRoomInput" placeholder="例如：my-family-wallet-2026" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono">
          <button type="button" onclick="saveSyncRoomKey()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold whitespace-nowrap shadow">
            套用房號
          </button>
        </div>
      </div>

      <div class="space-y-2 border-t pt-3">
        <label class="block text-xs font-bold text-slate-700 flex items-center justify-between">
          <span><i class="fa-solid fa-fire text-orange-500 mr-1"></i> 自訂 Firebase Config (可選)</span>
          <button type="button" onclick="clearCustomFirebaseConfig()" class="text-[11px] text-rose-500 hover:underline">清除設定</button>
        </label>
        <textarea id="firebaseConfigInput" rows="4" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", ...}' class="w-full p-2.5 text-xs font-mono border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-900 text-slate-100"></textarea>
        <button type="button" onclick="saveCustomFirebaseConfig()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-xl text-xs font-bold transition">
          儲存並連線 Firebase
        </button>
      </div>

      <div class="space-y-2 border-t pt-3">
        <h4 class="text-xs font-bold text-slate-800"><i class="fa-solid fa-file-export text-emerald-600 mr-1"></i> 離線 JSON 備份與匯入</h4>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="exportCardsJSON()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
            <i class="fa-solid fa-download"></i> 匯出 JSON 備份檔
          </button>
          <button type="button" onclick="document.getElementById('importJsonFileInput').click()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
            <i class="fa-solid fa-upload"></i> 匯入 JSON 備份檔
          </button>
          <input type="file" id="importJsonFileInput" accept=".json" class="hidden" onchange="importCardsJSON(event)">
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const DEFAULT_CARDS = [
      {
        id: 1,
        title: '全聯福利卡',
        code1D: 'PX88889999001',
        code2D: '',
        activeBarcodeType: 'CODE128',
        owner: '蛋',
        category: '超市賣場',
        expiryDate: '',
        cardColor: '#2563eb',
        canvasStyle: 'chip',
        bgImage1D: '',
        bgImage2D: '',
        rawImage1D: '',
        rawImage2D: ''
      },
      {
        id: 2,
        title: '電子發票載具',
        code1D: '/AB12345',
        code2D: '',
        activeBarcodeType: 'CODE128',
        owner: '蛋',
        category: '電子發票',
        expiryDate: '',
        cardColor: '#059669',
        canvasStyle: 'gradient',
        bgImage1D: '',
        bgImage2D: '',
        rawImage1D: '',
        rawImage2D: ''
      },
      {
        id: 3,
        title: '7-ELEVEN OPEN POINT',
        code1D: 'OP9988776655',
        code2D: '',
        activeBarcodeType: 'CODE128',
        owner: '蛋',
        category: '便利商店',
        expiryDate: '',
        cardColor: '#e11d48',
        canvasStyle: 'pattern',
        bgImage1D: '',
        bgImage2D: '',
        rawImage1D: '',
        rawImage2D: ''
      }
    ];

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'membership-cards-app';
    let db = null;
    let auth = null;
    let isCloudEnabled = false;

    function getSyncRoomKey() {
      try {
        return localStorage.getItem('custom_sync_room_key') || appId;
      } catch (e) {
        return appId;
      }
    }

    const SUPABASE_URL = 'https://msuwmgyvlcaodgpttfcr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_h89jxsCmM3bcTKdHqr5WhA_vGvb-EhS';
    let supabaseClient = null;

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        console.warn('Supabase Client 初始化提醒:', e);
      }
    }

    async function initCloudStorage() {
      let customFirebaseConfigRaw = null;
      try {
        customFirebaseConfigRaw = localStorage.getItem('custom_firebase_config');
      } catch(e) {}

      let firebaseConfigToUse = null;
      if (customFirebaseConfigRaw) {
        try {
          firebaseConfigToUse = JSON.parse(customFirebaseConfigRaw);
        } catch(e) {}
      } else if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        try {
          firebaseConfigToUse = JSON.parse(__firebase_config);
        } catch(e) {}
      }

      if (firebaseConfigToUse) {
        try {
          const app = initializeApp(firebaseConfigToUse);
          auth = getAuth(app);
          db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          isCloudEnabled = true;
          updateSyncStatusBadge('synced');
          setupFirestoreRealtimeListener();
          return;
        } catch (err) {
          console.warn('Firebase 初始化失敗:', err);
        }
      }

      if (supabaseClient) {
        const success = await setupSupabaseRealtimeListener();
        if (success) return;
      }

      updateSyncStatusBadge('local');
    }

    function setupFirestoreRealtimeListener() {
      if (!db) return;
      const roomKey = getSyncRoomKey();
      const cardsCol = collection(db, 'artifacts', roomKey, 'public', 'data', 'cards');

      onSnapshot(cardsCol, (snapshot) => {
        if (snapshot.metadata.hasPendingWrites) return;

        const cloudCards = [];
        snapshot.forEach((docSnap) => {
          cloudCards.push(docSnap.data());
        });

        if (cloudCards.length > 0) {
          cards = cloudCards.map(normalizeCard);
          cards.sort((a, b) => (b.id || 0) - (a.id || 0));
          saveCardsToStorage(cards);
          updateDropdowns();
          renderAllCards();
          updateSyncStatusBadge('synced');
        } else if (cards.length > 0 && isCloudEnabled) {
          cards.forEach(c => saveCardToCloud(c));
        }
      }, (error) => {
        console.error('雲端同步監聽錯誤:', error);
        updateSyncStatusBadge('error');
      });
    }

    async function setupSupabaseRealtimeListener() {
      if (!supabaseClient) return false;
      const roomKey = getSyncRoomKey();
      try {
        updateSyncStatusBadge('saving');
        
        const { data, error } = await supabaseClient.from('cards').select('*').eq('room_key', roomKey);
        
        if (!error && data && data.length > 0) {
          cards = data.map(normalizeCard);
          cards.sort((a, b) => (b.id || 0) - (a.id || 0));
          saveCardsToStorage(cards);
          updateDropdowns();
          renderAllCards();
        }

        isCloudEnabled = true;
        updateSyncStatusBadge('synced');
        return true;
      } catch (err) {
        return false;
      }
    }

    async function saveCardToCloud(card) {
      const roomKey = getSyncRoomKey();
      card.room_key = roomKey;

      if (db && isCloudEnabled) {
        try {
          updateSyncStatusBadge('saving');
          const cardDoc = doc(db, 'artifacts', roomKey, 'public', 'data', 'cards', String(card.id));
          await setDoc(cardDoc, card, { merge: true });
          updateSyncStatusBadge('synced');
        } catch (err) {
          updateSyncStatusBadge('error');
        }
      }
    }

    async function deleteCardFromCloud(cardId) {
      const roomKey = getSyncRoomKey();
      if (db && isCloudEnabled) {
        try {
          updateSyncStatusBadge('saving');
          const cardDoc = doc(db, 'artifacts', roomKey, 'public', 'data', 'cards', String(cardId));
          await deleteDoc(cardDoc);
          updateSyncStatusBadge('synced');
        } catch (err) {
          updateSyncStatusBadge('error');
        }
      }
    }

    function updateSyncStatusBadge(status) {
      const badge = document.getElementById('syncStatusBadge');
      if (!badge) return;

      if (status === 'synced') {
        badge.className = 'hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:opacity-90 transition cursor-pointer';
        badge.innerHTML = `<i class="fa-solid fa-cloud text-emerald-500"></i> 雲端同步中`;
      } else if (status === 'saving') {
        badge.className = 'hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200 hover:opacity-90 transition cursor-pointer';
        badge.innerHTML = `<i class="fa-solid fa-arrows-rotate animate-spin text-blue-500"></i> 雲端儲存中...`;
      } else {
        badge.className = 'hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200 hover:opacity-90 transition cursor-pointer';
        badge.innerHTML = `<i class="fa-solid fa-hard-drive text-slate-400"></i> 本地儲存`;
      }
    }

    function loadSavedCards() {
      try {
        const saved = localStorage.getItem('canvas_cards_v3');
        return saved ? JSON.parse(saved) : null;
      } catch (err) {
        return null;
      }
    }

    function saveCardsToStorage(data) {
      try {
        localStorage.setItem('canvas_cards_v3', JSON.stringify(data));
      } catch (err) {}
    }

    let cards = loadSavedCards();
    if (!cards || !Array.isArray(cards)) {
      cards = DEFAULT_CARDS;
      saveCardsToStorage(cards);
    }

    function normalizeCard(c) {
      if (!c.canvasStyle) c.canvasStyle = 'gradient';
      if (c.code1D === undefined && c.code2D === undefined) {
        if (c.barcodeType === 'QR') {
          c.code2D = c.code || '';
          c.code1D = '';
        } else {
          c.code1D = c.code || '';
          c.code2D = '';
        }
      }
      if (c.bgImage1D === undefined) c.bgImage1D = c.bgImage || '';
      if (c.bgImage2D === undefined) c.bgImage2D = '';
      if (c.rawImage1D === undefined) c.rawImage1D = c.bgImage1D || c.bgImage || '';
      if (c.rawImage2D === undefined) c.rawImage2D = c.bgImage2D || '';

      if (!c.activeBarcodeType) {
        c.activeBarcodeType = (c.code1D || c.bgImage1D) ? 'CODE128' : 'QR';
      }
      return c;
    }

    cards = cards.map(normalizeCard);

    function getExpiryStatus(dateStr) {
      if (!dateStr) return { status: 'valid', text: '無期限', colorClass: 'text-slate-500', bgClass: 'bg-slate-100' };
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const expDate = new Date(dateStr);
      expDate.setHours(0, 0, 0, 0);
      const diffTime = expDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { status: 'expired', text: '已過期', colorClass: 'text-rose-600', bgClass: 'bg-rose-100' };
      } else if (diffDays <= 30) {
        return { status: 'warning', text: `倒數 ${diffDays} 天`, colorClass: 'text-amber-600', bgClass: 'bg-amber-100' };
      }
      return { status: 'valid', text: '有效', colorClass: 'text-emerald-600', bgClass: 'bg-emerald-100' };
    }

    function switchMainTab(tab) {
      currentMainTab = tab;
      const tabs = ['all', 'expiring', 'valid'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        if (!btn) return;
        if (t === tab) {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap bg-blue-600 text-white shadow-sm';
        } else {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-2 whitespace-nowrap bg-white border border-slate-200';
        }
      });
      renderAllCards();
    }

    function updateDropdowns() {
      const owners = [...new Set(cards.map(c => c.owner).filter(Boolean))];
      const categories = [...new Set(cards.map(c => c.category).filter(Boolean))];
      const titles = [...new Set(cards.map(c => c.title).filter(Boolean))];

      const ownerList = document.getElementById('ownerList');
      if (ownerList) ownerList.innerHTML = owners.map(o => `<option value="${escapeHtml(o)}">`).join('');

      const categoryList = document.getElementById('categoryList');
      if (categoryList) categoryList.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join('');

      const titleList = document.getElementById('titleList');
      if (titleList) titleList.innerHTML = titles.map(t => `<option value="${escapeHtml(t)}">`).join('');

      if (ownerFilter) {
        const currentOwner = ownerFilter.value;
        ownerFilter.innerHTML = '<option value="">所有持有人</option>' + owners.map(o => `<option value="${escapeHtml(o)}" ${o === currentOwner ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
      }

      if (categoryFilter) {
        const currentCat = categoryFilter.value;
        categoryFilter.innerHTML = '<option value="">所有種類標籤</option>' + categories.map(c => `<option value="${escapeHtml(c)}" ${c === currentCat ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
      }
    }

    function saveAndRefresh() {
      saveCardsToStorage(cards);
      updateDropdowns();
      renderAllCards();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderAllCards() {
      if (!cardGrid) return;

      const searchVal = (searchInput ? searchInput.value : '').toLowerCase().trim();
      const ownerVal = ownerFilter ? ownerFilter.value : '';
      const catVal = categoryFilter ? categoryFilter.value : '';
      const expVal = expiryFilter ? expiryFilter.value : '';

      let countAllNum = cards.length;
      let countExpiringNum = 0;
      let countValidNum = 0;

      cards.forEach(card => {
        const statusObj = getExpiryStatus(card.expiryDate);
        if (statusObj.status === 'expired' || statusObj.status === 'warning') {
          countExpiringNum++;
        }
        if (statusObj.status === 'valid') {
          countValidNum++;
        }
      });

      const countAllEl = document.getElementById('countAll');
      const countExpiringEl = document.getElementById('countExpiring');
      const countValidEl = document.getElementById('countValid');
      if (countAllEl) countAllEl.innerText = countAllNum;
      if (countExpiringEl) countExpiringEl.innerText = countExpiringNum;
      if (countValidEl) countValidEl.innerText = countValidNum;

      const filtered = cards.filter(card => {
        const statusObj = getExpiryStatus(card.expiryDate);

        if (currentMainTab === 'expiring' && statusObj.status !== 'expired' && statusObj.status !== 'warning') {
          return false;
        }
        if (currentMainTab === 'valid' && statusObj.status !== 'valid') {
          return false;
        }

        if (expVal && statusObj.status !== expVal) {
          return false;
        }

        if (searchVal) {
          const matchTitle = (card.title || '').toLowerCase().includes(searchVal);
          const matchOwner = (card.owner || '').toLowerCase().includes(searchVal);
          const matchCode1 = (card.code1D || '').toLowerCase().includes(searchVal);
          const matchCode2 = (card.code2D || '').toLowerCase().includes(searchVal);
          const matchCat = (card.category || '').toLowerCase().includes(searchVal);
          if (!matchTitle && !matchOwner && !matchCode1 && !matchCode2 && !matchCat) {
            return false;
          }
        }

        if (ownerVal && card.owner !== ownerVal) return false;
        if (catVal && card.category !== catVal) return false;

        return true;
      });

      if (filtered.length === 0) {
        cardGrid.innerHTML = `
          <div class="col-span-full py-12 text-center bg-white rounded-2xl border border-dashed border-slate-300 p-8">
            <i class="fa-solid fa-credit-card text-4xl text-slate-300 mb-3 block"></i>
            <p class="text-sm text-slate-500 font-medium">沒有找到符合條件的會員卡或載具</p>
            <button onclick="openAddModal()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition">
              <i class="fa-solid fa-plus mr-1"></i> 新增第一張卡片
            </button>
          </div>
        `;
        return;
      }

      cardGrid.innerHTML = filtered.map(card => {
        const expStatus = getExpiryStatus(card.expiryDate);
        return `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition group">
            <div class="p-3.5 pb-2 flex items-center justify-between border-b border-slate-100">
              <div class="flex items-center gap-2 truncate">
                <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${card.cardColor || '#2563eb'};"></span>
                <h3 class="font-bold text-sm text-slate-800 truncate">${escapeHtml(card.title)}</h3>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="openEditModal(event, ${card.id})" class="text-slate-400 hover:text-blue-600 p-1.5 rounded-lg hover:bg-slate-100 transition text-xs" title="編輯">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button onclick="deleteCard(event, ${card.id})" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-slate-100 transition text-xs" title="刪除">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>

            <div class="p-3 bg-slate-50/50 flex-1 flex flex-col justify-center">
              <div class="card-canvas-container cursor-pointer rounded-xl overflow-hidden shadow-sm" onclick="openScanModal(${card.id})" title="點擊放大感應條碼">
                <canvas id="cardCanvas_${card.id}" width="400" height="252"></canvas>
              </div>
            </div>

            <div class="px-3.5 py-2.5 bg-white border-t border-slate-100 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2 text-slate-500 font-medium">
                <span class="bg-slate-100 px-2 py-0.5 rounded-md font-semibold text-[11px] text-slate-700">${escapeHtml(card.owner)}</span>
                <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md text-[11px] font-semibold">${escapeHtml(card.category)}</span>
              </div>
              <div>
                <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${expStatus.bgClass} ${expStatus.colorClass}">
                  ${expStatus.text}
                </span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      setTimeout(() => {
        filtered.forEach(card => {
          const cvs = document.getElementById(`cardCanvas_${card.id}`);
          if (cvs) drawCardCanvas(cvs, card);
        });
      }, 30);
    }

    function downloadCanvasPNG() {
      const scanCanvas = document.getElementById('scanCanvas');
      if (!scanCanvas) return;
      const card = cards.find(c => c.id === currentScanCardId);

    function compressAndResizeImage(file, maxDimension = 1200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("檔案讀取失敗"));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error("圖片載入失敗"));
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', 0.88));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function scanBarcodeFromImage(dataUrl) {
      try {
        let codeDetected = null;
        let detectedType = 'CODE128';

        if ('BarcodeDetector' in window) {
          try {
            const detector = new BarcodeDetector();
            const img = new Image();
            img.src = dataUrl;
            await new Promise(r => img.onload = r);
            const barcodes = await detector.detect(img);
            if (barcodes && barcodes.length > 0) {
              codeDetected = barcodes[0].rawValue;
              detectedType = barcodes[0].format === 'qr_code' ? 'QR' : 'CODE128';
            }
          } catch(err) {}
        }

        if (!codeDetected && typeof ZXing !== 'undefined') {
          try {
            const codeReader = new ZXing.BrowserMultiFormatReader();
            const img = new Image();
            img.src = dataUrl;
            await new Promise(r => img.onload = r);
            const result = await codeReader.decodeFromImageElement(img);
            if (result && result.getText()) {
              codeDetected = result.getText();
              detectedType = codeDetected.startsWith('http') ? 'QR' : 'CODE128';
            }
          } catch(err) {}
        }

        if (codeDetected) return { code: codeDetected, type: detectedType };
      } catch (e) {}
      return null;
    }

    async function drawCardCanvas(canvas, cardData, isScanView = false) {
      if (!canvas) return;
      normalizeCard(cardData);

      const dpr = Math.max(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      const displayWidth = rect.width > 0 ? rect.width : (isScanView ? 600 : 400);
      const displayHeight = rect.height > 0 ? rect.height : (isScanView ? 378 : 252);

      canvas.width = Math.round(displayWidth * dpr);
      canvas.height = Math.round(displayHeight * dpr);

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const width = displayWidth;
      const height = displayHeight;

      ctx.clearRect(0, 0, width, height);

      const activeType = cardData.activeBarcodeType || 'CODE128';
      const targetBgImage = (activeType === 'QR' ? cardData.bgImage2D : cardData.bgImage1D) || cardData.bgImage1D || cardData.bgImage2D || '';
      const hasBgImage = !!targetBgImage;

      // 繪製高級 Canvas 藝術背景
      drawCanvasBackground(ctx, width, height, isScanView ? '#ffffff' : cardData.cardColor, cardData.canvasStyle, isScanView);

      // 繪製卡片標題與裝飾資訊
      if (!isScanView) {
        const titleFontSize = Math.max(14, Math.round(width * 0.045));
        const subFontSize = Math.max(10, Math.round(width * 0.028));

        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 4;
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${titleFontSize}px sans-serif`;
        ctx.fillText(cardData.title, 16, titleFontSize + 10);

        ctx.font = `${subFontSize}px sans-serif`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fillText(`持有人：${cardData.owner} · ${cardData.category}`, 16, titleFontSize + subFontSize + 16);

        if (cardData.expiryDate) {
          const expStatus = getExpiryStatus(cardData.expiryDate);
          ctx.font = `bold ${subFontSize}px sans-serif`;
          ctx.textAlign = 'right';
          ctx.fillStyle = expStatus.status === 'expired' ? '#fca5a5' : '#e2e8f0';
          ctx.fillText(`效期: ${cardData.expiryDate}`, width - 16, titleFontSize + 10);
          ctx.textAlign = 'left';
        }

        ctx.shadowBlur = 0;
      }

      // 條碼展示白框與渲染
      const activeCode = (activeType === 'QR' ? cardData.code2D : cardData.code1D) || cardData.code1D || cardData.code2D || '';
      const margin = isScanView ? 12 : 10;
      const boxHeight = isScanView ? height - (margin * 2) : height * 0.65;
      const boxY = isScanView ? margin : height - boxHeight - margin;
      const boxWidth = width - (margin * 2);

      ctx.fillStyle = '#ffffff';
      if (!isScanView) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 8;
      }
      roundRect(ctx, margin, boxY, boxWidth, boxHeight, 10, true, false);
      ctx.shadowBlur = 0;

      if (hasBgImage) {
        try {
          const img = new Image();
          img.src = targetBgImage;
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
          });

          const padX = 12;
          const padY = 8;
          const hasText = !!activeCode;
          const maxW = boxWidth - padX * 2;
          const maxH = boxHeight - padY * 2 - (hasText ? 18 : 0);

          const scale = Math.min(maxW / img.width, maxH / img.height);
          const drawW = Math.round(img.width * scale);
          const drawH = Math.round(img.height * scale);

          const drawX = Math.round(margin + (boxWidth - drawW) / 2);
          const drawY = Math.round(boxY + padY + (maxH - drawH) / 2);

          ctx.drawImage(img, drawX, drawY, drawW, drawH);

          if (hasText) {
            ctx.fillStyle = '#0f172a';
            ctx.font = `bold ${Math.max(12, Math.round(width * 0.035))}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText(activeCode, width / 2, boxY + boxHeight - 6);
            ctx.textAlign = 'left';
          }
        } catch (e) {}
      } else if (activeCode) {
        const barcodeImg = await generateBarcodeImage(activeCode, activeType);
        if (barcodeImg) {
          if (activeType === 'QR') {
            const qrSize = Math.min(boxWidth - 20, boxHeight - 16);
            const drawX = Math.round((width - qrSize) / 2);
            const drawY = Math.round(boxY + (boxHeight - qrSize) / 2);

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(barcodeImg, drawX, drawY, Math.round(qrSize), Math.round(qrSize));
            ctx.imageSmoothingEnabled = true;
          } else {
            const maxW = boxWidth - 24;
            const maxH = boxHeight - 32;
            const bWidth = barcodeImg.width || 1;
            const bHeight = barcodeImg.height || 1;

            const scale = Math.min(maxW / bWidth, maxH / bHeight);
            const drawW = Math.round(bWidth * scale);
            const drawH = Math.round(bHeight * scale);

            const drawX = Math.round((width - drawW) / 2);
            const drawY = Math.round(boxY + 6 + (maxH - drawH) / 2);

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(barcodeImg, drawX, drawY, drawW, drawH);
            ctx.imageSmoothingEnabled = true;

            ctx.fillStyle = '#0f172a';
            ctx.font = `bold ${Math.max(12, Math.round(width * 0.035))}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText(activeCode, width / 2, boxY + boxHeight - 6);
            ctx.textAlign = 'left';
          }
        }
      } else {
        ctx.fillStyle = '#334155';
        ctx.font = `bold ${Math.max(11, Math.round(width * 0.032))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('📷 請填寫號碼或上傳條碼圖片', width / 2, boxY + boxHeight / 2);
        ctx.textAlign = 'left';
      }
    }

    function drawCanvasBackground(ctx, width, height, baseColor, style, isScanView) {
      if (isScanView) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        return;
      }

      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, baseColor);
      gradient.addColorStop(1, adjustColor(baseColor, -50));
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      if (style === 'chip') {
        // 繪製金屬 IC 晶片 (Canvas 原生繪製)
        const chipX = width - 52;
        const chipY = 16;
        const chipW = 36;
        const chipH = 26;
        ctx.fillStyle = '#f59e0b';
        roundRect(ctx, chipX, chipY, chipW, chipH, 4, true, false);
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(chipX + 12, chipY); ctx.lineTo(chipX + 12, chipY + chipH);
        ctx.moveTo(chipX + 24, chipY); ctx.lineTo(chipX + 24, chipY + chipH);
        ctx.moveTo(chipX, chipY + 13); ctx.lineTo(chipX + chipW, chipY + 13);
        ctx.stroke();
      } else if (style === 'pattern') {
        // 幾何圓點網格
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        for (let x = 10; x < width; x += 16) {
          for (let y = 10; y < height; y += 16) {
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else if (style === 'wave') {
        // 流動水波紋
        ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.beginPath();
        ctx.moveTo(0, height * 0.4);
        ctx.bezierCurveTo(width * 0.3, height * 0.1, width * 0.7, height * 0.7, width, height * 0.3);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();
      }
    }

    function generateBarcodeImage(codeText, type) {
      return new Promise((resolve) => {
        const tempCanvas = document.createElement('canvas');
        if (type === 'QR') {
          if (typeof QRious !== 'undefined') {
            try {
              new QRious({ element: tempCanvas, value: codeText, size: 300, level: 'H' });
              const img = new Image();
              img.onload = () => resolve(img);
              img.onerror = () => resolve(null);
              img.src = tempCanvas.toDataURL();
              return;
            } catch (e) {}
          }
          resolve(null);
        } else {
          try {
            if (typeof JsBarcode !== 'undefined') {
              JsBarcode(tempCanvas, codeText, {
                format: "CODE128",
                displayValue: false,
                margin: 0,
                height: 80,
                width: 2,
                background: "#ffffff",
                lineColor: "#000000"
              });
              const img = new Image();
              img.onload = () => resolve(img);
              img.onerror = () => resolve(null);
              img.src = tempCanvas.toDataURL();
            } else {
              resolve(null);
            }
          } catch (e) { resolve(null); }
        }
      });
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function adjustColor(col, amt) {
      col = col.replace('#', '');
      let num = parseInt(col, 16);
      let r = (num >> 16) + amt; if (r > 255) r = 255; else if (r < 0) r = 0;
      let b = ((num >> 8) & 0x00FF) + amt; if (b > 255) b = 255; else if (b < 0) b = 0;
      let g = (num & 0x0000FF) + amt; if (g > 255) g = 255; else if (g < 0) g = 0;
      return '#' + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
    }

      currentRawImageData2D = '';
      if (imagePreviewContainer1D) imagePreviewContainer1D.classList.add('hidden');
      if (imagePreviewContainer2D) imagePreviewContainer2D.classList.add('hidden');
      if (cardForm) cardForm.reset();
      const modal = document.getElementById('addModal');
      modal.classList.remove('hidden-modal');
      modal.classList.add('active-modal');
    }

    function openEditModal(e, id) {
      if (e) e.stopPropagation();
      const card = cards.find(c => c.id === id);
      if (!card) return;
      editingCardId = id;

      document.getElementById('title').value = card.title || '';
      document.getElementById('code1D').value = card.code1D || '';
      document.getElementById('code2D').value = card.code2D || '';
      document.getElementById('owner').value = card.owner || '蛋';
      document.getElementById('category').value = card.category || '';
      document.getElementById('expiryDate').value = card.expiryDate || '';
      document.getElementById('cardColor').value = card.cardColor || '#2563eb';
      document.getElementById('canvasStyle').value = card.canvasStyle || 'gradient';

      currentUploadedImageData1D = card.bgImage1D || '';
      currentUploadedImageData2D = card.bgImage2D || '';
      currentRawImageData1D = card.rawImage1D || card.bgImage1D || '';
      currentRawImageData2D = card.rawImage2D || card.bgImage2D || '';

      if (currentUploadedImageData1D && imagePreview1D && imagePreviewContainer1D) {
        imagePreview1D.src = currentUploadedImageData1D;
        imagePreviewContainer1D.classList.remove('hidden');
      } else if (imagePreviewContainer1D) {
        imagePreviewContainer1D.classList.add('hidden');
      }

      if (currentUploadedImageData2D && imagePreview2D && imagePreviewContainer2D) {
        imagePreview2D.src = currentUploadedImageData2D;
        imagePreviewContainer2D.classList.remove('hidden');
      } else if (imagePreviewContainer2D) {
        imagePreviewContainer2D.classList.add('hidden');
      }

      const modal = document.getElementById('addModal');
      modal.classList.remove('hidden-modal');
      modal.classList.add('active-modal');
    }

    function closeAddModal() {
      const modal = document.getElementById('addModal');
      modal.classList.remove('active-modal');
      modal.classList.add('hidden-modal');
    }

    function deleteCard(e, id) {
      if (e) e.stopPropagation();
      pendingDeleteId = id;
      const modal = document.getElementById('deleteModal');
      modal.classList.remove('hidden-modal');
      modal.classList.add('active-modal');
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      const modal = document.getElementById('deleteModal');
      modal.classList.remove('active-modal');
      modal.classList.add('hidden-modal');
    }

    function confirmDeleteCard() {
      if (pendingDeleteId !== null) {
        cards = cards.filter(c => c.id !== pendingDeleteId);
        deleteCardFromCloud(pendingDeleteId);
        saveAndRefresh();
        showToast('已刪除卡片');
      }
      closeDeleteModal();
    }

    function openSyncSettingsModal() {
      const modal = document.getElementById('syncSettingsModal');
      document.getElementById('syncRoomInput').value = getSyncRoomKey();
      modal.classList.remove('hidden-modal');
      modal.classList.add('active-modal');
    }

    function closeSyncSettingsModal() {
      const modal = document.getElementById('syncSettingsModal');
      modal.classList.remove('active-modal');
      modal.classList.add('hidden-modal');
    }

    function saveSyncRoomKey() {
      const val = document.getElementById('syncRoomInput').value.trim();
      if (val) {
        localStorage.setItem('custom_sync_room_key', val);
        showToast(`已切換房號至：${val}`);
        initCloudStorage();
        closeSyncSettingsModal();
      }
    }

    function saveCustomFirebaseConfig() {
      const val = document.getElementById('firebaseConfigInput').value.trim();
      if (val) {
        try {
          JSON.parse(val);
          localStorage.setItem('custom_firebase_config', val);
          showToast('已儲存 Firebase 設定');
          initCloudStorage();
          closeSyncSettingsModal();
        } catch (e) {
          showToast('❌ JSON 格式不正確');
        }
      }
    }

    function clearCustomFirebaseConfig() {
      localStorage.removeItem('custom_firebase_config');
      showToast('已清除 Firebase 設定');
      initCloudStorage();
    }

    function exportCardsJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `cards_canvas_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('已匯出 JSON 備份檔！');
    }

    function importCardsJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            cards = imported.map(normalizeCard);
            saveAndRefresh();
            showToast(`已成功匯入 ${cards.length} 張卡片！`);
            closeSyncSettingsModal();
          }
        } catch (err) {}
      };
      reader.readAsText(file);
    }

    // 全域 window 綁定
    window.switchMainTab = switchMainTab;
    window.openAddModal = openAddModal;
    window.openEditModal = openEditModal;
    window.closeAddModal = closeAddModal;
    window.openScanModal = openScanModal;
    window.closeScanModal = closeScanModal;
    window.deleteCard = deleteCard;
    window.closeDeleteModal = closeDeleteModal;
    window.confirmDeleteCard = confirmDeleteCard;
    window.toggleCropAspectRatio = toggleCropAspectRatio;
    window.rotateCropImage = rotateCropImage;
    window.confirmCrop = confirmCrop;
    window.closeCropModal = closeCropModal;
    window.openSyncSettingsModal = openSyncSettingsModal;
    window.closeSyncSettingsModal = closeSyncSettingsModal;
    window.saveSyncRoomKey = saveSyncRoomKey;
    window.saveCustomFirebaseConfig = saveCustomFirebaseConfig;
    window.clearCustomFirebaseConfig = clearCustomFirebaseConfig;
    window.exportCardsJSON = exportCardsJSON;
    window.importCardsJSON = importCardsJSON;
    window.downloadCanvasPNG = downloadCanvasPNG;
    window.reCropExistingImage = reCropExistingImage;
    window.clearImagePreview = clearImagePreview;
    window.switchScanBarcodeType = switchScanBarcodeType;
  </script>
</body>
</html>
